    if (org >= 2) b.push({ id: 'organizer', label: 'Организатор мероприятий', icon: 'calendar' });
    return b;
  });
}

/* История изменений рейтинга: фиксируем каждое изменение баллов и мест */
function snapshotRatings() {
  const c = new Map(); companyScores().forEach((r) => c.set(r.orgId, { t: r.total, r: r.rank }));
  const p = new Map(); personScores().forEach((r) => p.set(r.userId, { t: r.total, r: r.rank }));
  return { c, p };
}
function withRatingDiff(reason, fn) {
  const before = snapshotRatings();
  fn();
  commit();
  const after = snapshotRatings();
  const ts = new Date().toISOString();
  const changes = { orgs: [], people: [] };
  after.c.forEach((v, id) => {
    const b = before.c.get(id) || { t: 0, r: null };
    if (Math.abs(v.t - b.t) >= 0.05 || v.r !== b.r) { const row = { ts, kind: 'org', id, from: b.t, to: v.t, rankFrom: b.r, rankTo: v.r, reason }; DB.ratingLog.push(row); changes.orgs.push(row); }
  });
  after.p.forEach((v, id) => {
    const b = before.p.get(id) || { t: 0, r: null };
    if (Math.abs(v.t - b.t) >= 0.05) { const row = { ts, kind: 'person', id, from: b.t, to: v.t, rankFrom: b.r, rankTo: v.r, reason }; DB.ratingLog.push(row); changes.people.push(row); }
  });
  if (DB.ratingLog.length > 4000) DB.ratingLog = DB.ratingLog.slice(-4000);
  saveDB();
  return changes;
}

/* =====================================================================
   ЖИЗНЕННЫЙ ЦИКЛ ПРОВЕРКИ АКТИВНОСТИ
   ===================================================================== */
function entityType(x) { return x.id[0] === 'p' ? 'project' : x.id[0] === 'e' ? 'event' : 'achievement'; }
function entityOrg(x) { return x.orgId || (U(x.userId) ? U(x.userId).companyId : null); }
function entityTitle(x) { return x.title; }
function entityLink(x) { const t = entityType(x); return t === 'project' ? '#project-' + x.id : t === 'event' ? '#event-' + x.id : '#person-' + x.userId; }
function entityOwners(x) {
  const t = entityType(x);
  if (t === 'achievement') return [x.userId];
  if (t === 'event') return uniq([x.createdBy, ...(x.organizers || [])]);
  return uniq([x.createdBy, x.leaderId]);
}
function findEntity(id) {
  return DB.projects.find((x) => x.id === id) || DB.events.find((x) => x.id === id) || DB.achievements.find((x) => x.id === id);
}
function hasConflict(expert, orgId) {
  if (!expert || !orgId) return !!expert && false;
  const root = rootOf(orgId);
  const list = [...(expert.conflicts || [])];
  if (expert.companyId) list.push(expert.companyId);
  return list.some((c) => c === orgId || c === root || (rootOf(c) && rootOf(c) !== headId() && rootOf(c) === root));
}
const experts = () => DB.users.filter((u) => u.role === 'expert' && !u.blocked);
function expertLoad(id) {
  return [...DB.projects, ...DB.events, ...DB.achievements].filter((x) => x.review && x.review.expertId === id && ['submitted', 'in_review'].includes(x.status)).length;
}
function pickExpert(x, exclude = []) {
  const org = entityOrg(x);
  const pool = experts().filter((e) => !hasConflict(e, org) && !exclude.includes(e.id));
  if (!pool.length) return null;
  pool.sort((a, b) => expertLoad(a.id) - expertLoad(b.id));
  return pool[0];
}
/* Повторный учёт одной активности запрещён: ищем дубль по названию, организации и пересечению дат */
function findDuplicate(x) {
  const t = norm(x.title);
  const type = entityType(x);
  const list = type === 'project' ? DB.projects : type === 'event' ? DB.events : DB.achievements;
  return list.find((y) => {
    if (y.id === x.id || y.status === 'rejected' || y.status === 'draft') return false;
    if (norm(y.title) !== t) return false;
    if (type === 'achievement') return y.userId === x.userId && y.date === x.date;
    if (y.orgId !== x.orgId) return false;
    if (type === 'event') return y.date === x.date;
    return !(y.end < x.start || y.start > x.end);
  });
}
function submitForReview(x) {
  const u = me();
  const prev = x.status;
  x.status = 'submitted';
  x.submittedAt = new Date().toISOString();
  x.history = x.history || [];
  x.history.push({ ts: x.submittedAt, actorId: u.id, action: prev === 'needs_info' ? 'Уточнения отправлены, повторная проверка' : 'Отправлено на проверку' });
  if (!x.review || !x.review.expertId || prev !== 'needs_info') {
    const ex = pickExpert(x);
    x.review = { expertId: ex ? ex.id : null, scores: null, comment: '', assignedAt: x.submittedAt, decidedAt: null };
    if (ex) {
      x.history.push({ ts: x.submittedAt, actorId: 'system', action: 'Назначен эксперт: ' + ex.name + ' (без конфликта интересов)' });
      notify(ex.id, `Новая заявка на проверку: «${x.title}»`, '#review-' + x.id);
    } else x.history.push({ ts: x.submittedAt, actorId: 'system', action: 'Нет доступного эксперта без конфликта интересов — назначит администратор' });
  } else if (x.review.expertId) notify(x.review.expertId, `Получены уточнения по заявке «${x.title}»`, '#review-' + x.id);
  audit('Отправка на проверку', entityType(x), x.id, x.title);
  commit();
}
function takeInWork(x) {
  x.status = 'in_review';
  x.history.push({ ts: new Date().toISOString(), actorId: me().id, action: 'Взято на рассмотрение' });
  audit('Эксперт взял заявку в работу', entityType(x), x.id, x.title);
  entityOwners(x).forEach((id) => notify(id, `Заявка «${x.title}» на рассмотрении у эксперта`, entityLink(x)));
  commit();
}
function decide(x, decision, data) {
  const ex = me();
  const labels = { confirmed: 'Подтверждено экспертом', rejected: 'Отклонено экспертом', needs_info: 'Запрошены уточнения' };
  const owners = entityOwners(x);
  const teamIds = entityType(x) === 'project' ? uniq((x.team || []).map((t) => t.userId)) : [];
  const changes = withRatingDiff(`${labels[decision]}: «${x.title}»`, () => {
    x.status = decision;
    x.review = { ...(x.review || {}), ...data, expertId: ex.id, decidedAt: new Date().toISOString() };
    x.history.push({ ts: x.review.decidedAt, actorId: ex.id, action: labels[decision], note: data.comment || '' });
    audit(labels[decision], entityType(x), x.id, `${x.title}; средний балл ${fmt1(scoresAvg(data.scores))}` + (data.comment ? `; комментарий: ${data.comment}` : ''));
  });
  const texts = { confirmed: 'подтверждена', rejected: 'отклонена', needs_info: 'требует уточнений' };
  uniq([...owners, ...teamIds]).forEach((id) => {
    let msg = `Активность «${x.title}» ${texts[decision]}.`;
    const ch = changes.people.find((r) => r.id === id);
    if (ch) msg += ch.from < 0.05 ? ` Вы вошли в рейтинг: ${fmt1(ch.to)} баллов, место ${ch.rankTo}.` : ` Ваш рейтинг: ${fmt1(ch.from)} → ${fmt1(ch.to)} баллов` + (ch.rankFrom && ch.rankTo ? `, место ${ch.rankFrom} → ${ch.rankTo}.` : '.');
    notify(id, msg, entityLink(x));
  });
  const org = entityOrg(x);
  const chair = O(org) && O(org).council.chairId;
  if (chair && !owners.includes(chair)) notify(chair, `Активность совета «${x.title}» ${texts[decision]}.`, entityLink(x));
  saveDB();
  return changes;
}

/* ---------- медиа: IndexedDB с запасным вариантом в памяти ---------- */
const MEDIA = {
  db: null, urls: new Map(), mem: new Map(),
  async open() {
    if (this.db !== null) return this.db;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('jastar-media', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('m');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = false; }
    return this.db;
  },
  async put(key, blob) {
    this.mem.set(key, blob);
    const db = await this.open(); if (!db) return;
    try { await new Promise((res, rej) => { const tx = db.transaction('m', 'readwrite'); tx.objectStore('m').put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { /* остаётся в памяти */ }
  },
  async get(key) {
    if (this.mem.has(key)) return this.mem.get(key);
    const db = await this.open(); if (!db) return null;
    try { return await new Promise((res, rej) => { const r = db.transaction('m').objectStore('m').get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); } catch (e) { return null; }
  },
  async url(key) {
    if (this.urls.has(key)) return this.urls.get(key);
    const b = await this.get(key); if (!b) return null;
    const u = URL.createObjectURL(b); this.urls.set(key, u); return u;
  },
  async clear() {
    this.mem.clear(); this.urls.clear();
    const db = await this.open(); if (!db) return;
    try { await new Promise((res) => { const tx = db.transaction('m', 'readwrite'); tx.objectStore('m').clear(); tx.oncomplete = res; tx.onerror = res; }); } catch (e) { /* ignore */ }
  }
};
async function hydrateMedia(root = document) {
  for (const el of $$('[data-media]', root)) {
    const u = await MEDIA.url(el.dataset.media);
    if (!u) continue;
    if (el.tagName === 'IMG') { el.src = u; el.closest('.ph')?.classList.add('has-img'); }
    else if (el.tagName === 'VIDEO') el.src = u;
  }
}
async function resizeImage(file, max = 1280, q = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b || file), 'image/jpeg', q));
  } catch (e) { return file; } finally { URL.revokeObjectURL(url); }
}
/* Ключ файла: в демо — локальный ключ, в общей базе — путь в хранилище с папкой пользователя */
function newMediaKey(name, kind) {
  if (typeof LIVE !== 'undefined' && LIVE && me()) {
    const ext = (String(name || '').match(/\.[a-z0-9]{1,6}$/i) || [''])[0].toLowerCase();
    return (kind === 'avatar' ? 'avatars/' : 'files/') + me().id + '/' + uid('f') + ext;
  }
  return uid(kind === 'avatar' ? 'ava' : 'blob');
}
/* Приём файлов: фото сжимаются, видео до 40 МБ, документы до 15 МБ */
async function acceptFiles(fileList, opts = {}) {
  const out = []; const errs = [];
  for (const f of Array.from(fileList || [])) {
    const isImg = /^image\//.test(f.type);
    const isVid = /^video\//.test(f.type);
    if (isVid && f.size > 40 * 1048576) { errs.push(`${f.name}: видео больше 40 МБ`); continue; }
    if (!isImg && !isVid && f.size > 15 * 1048576) { errs.push(`${f.name}: файл больше 15 МБ`); continue; }
    const key = newMediaKey(isImg ? 'photo.jpg' : f.name);
    const blob = isImg ? await resizeImage(f, opts.max || 1280) : f;
    try { await MEDIA.put(key, blob); } catch (e) { errs.push(`${f.name}: не удалось загрузить (${e.message || e})`); continue; }
    const kind = opts.kind || (isImg ? 'photo' : isVid ? 'video' : /presentation|pptx?$/i.test(f.type + f.name) ? 'presentation' : 'doc');
    out.push({ id: uid('m'), kind, name: f.name, size: blob.size, key, type: f.type, uploadedAt: new Date().toISOString() });
  }
  if (errs.length) toast(errs.join('; '), 'bad');
  return out;
}

/* ---------- скачивание файлов через возможность downloads ---------- */
let DL = null;
(async () => { try { DL = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { DL = null; } })();
async function saveFile(filename, data) {
  if (!DL) {
    if (!window.claude) {
      /* самостоятельный хостинг (GitHub Pages, локальный файл): обычное скачивание браузером */
      const blob = data instanceof Blob ? data : new Blob([data]);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast('Файл сохранён: ' + filename, 'good');
      return true;
    }
    toast('Скачивание пока недоступно, попробуйте через пару секунд', 'warn'); return false;
  }
  try { await DL.save({ filename, data }); toast('Файл передан на сохранение: ' + filename, 'good'); return true; }
  catch (e) {
    if (e && e.code === 'declined') toast('Сохранение отменено');
    else if (e && e.code === 'rate_limited') toast('Предыдущее окно сохранения ещё открыто', 'warn');
    else toast('Не удалось сохранить файл', 'bad');
    return false;
  }
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if ($(`script[src="${src}"]`)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src));
    document.head.appendChild(s);
  });
}
const LIBS = {
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  h2c: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
};
async function exportXlsx(filename, sheets) {
  try { await loadScript(LIBS.xlsx); } catch (e) { toast('Не удалось загрузить модуль Excel', 'bad'); return; }
  const wb = XLSX.utils.book_new();
  sheets.forEach(({ name, rows }) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = (rows[0] || []).map((_, i) => ({ wch: Math.min(48, Math.max(10, ...rows.slice(0, 60).map((r) => String(r[i] ?? '').length + 2))) }));
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  });
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  await saveFile(filename, new Blob([buf]));
}
async function exportPdf(filename, node) {
  try { await loadScript(LIBS.h2c); await loadScript(LIBS.jspdf); } catch (e) { toast('Не удалось загрузить модуль PDF', 'bad'); return; }
  toast('Формирую PDF…');
  const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const pw = 210, ph = 297, m = 10;
  const iw = pw - 2 * m;
  const pxPerMm = canvas.width / iw;
  const pageHpx = Math.floor((ph - 2 * m) * pxPerMm);
  let y = 0, first = true;
  while (y < canvas.height) {
    const h = Math.min(pageHpx, canvas.height - y);
    const c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
    c.getContext('2d').drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
    if (!first) pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', m, m, iw, h / pxPerMm);
    first = false; y += h;
  }
  await saveFile(filename, pdf.output('blob'));
}

/* ---------- API-слой (точка подключения Supabase) ---------- */
const api = {
  async hash(s) {
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('jastar:' + s)); return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { let h = 0; for (const c of 'jastar:' + s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'h' + h; }
  },
  async signUp(data) {
    const email = data.email.trim().toLowerCase();
    if (DB.users.some((u) => u.email === email)) throw new Error('Пользователь с таким e-mail уже зарегистрирован');
    const u = {
      id: uid('u'), email, pass: await api.hash(data.password), name: data.name, position: data.position, companyId: data.companyId,
      dept: data.dept || '', regionId: data.regionId, city: data.city || (RG(data.regionId) || {}).city || '', startYear: +data.startYear || new Date().getFullYear(),
      bio: data.bio || '', education: data.education || '', interests: data.interests || '', skills: data.skills || [], sport: '',
      councilRole: 'Участник', role: 'member', photo: data.photo || null, media: [], verified: false, blocked: false, conflicts: [], createdAt: new Date().toISOString()
    };
    DB.users.push(u);
    DB.session.userId = u.id;
    reindex();
    audit('Регистрация пользователя', 'user', u.id, `${u.name}, ${orgLabel(u.companyId)}`);
    const org = O(u.companyId);
    if (org && org.council.chairId) notify(org.council.chairId, `Новый участник ${u.name} просит подтвердить членство в Молодёжном совете`, '#company-' + org.id);
    notify(u.id, 'Добро пожаловать в JASTAR HUB! Заполните профиль и добавьте первую активность.', '#me');
    commit();
    return u;
  },
  async signIn(email, password) {
    const u = DB.users.find((x) => x.email === email.trim().toLowerCase());
    if (!u || !u.pass || u.pass !== (await api.hash(password))) throw new Error('Неверный e-mail или пароль');
    if (u.blocked) throw new Error('Учётная запись заблокирована администратором');
    DB.session.userId = u.id; audit('Вход в систему', 'user', u.id, ''); commit();
    return u;
  },
  signInDemo(userId) { DB.session.userId = userId; audit('Вход (демо-аккаунт)', 'user', userId, ROLES[U(userId).role].name); commit(); },
  signOut() { audit('Выход из системы', 'user', DB.session.userId, ''); DB.session.userId = null; commit(); }
};

function blankProject() {
  const u = me();
  const orgId = UI.pfOrg || (u.companyId && O(u.companyId) ? u.companyId : headId());
  const s = new Date(); const e = new Date(); e.setMonth(e.getMonth() + 2);
  return { id: null, title: '', orgId, companyId: rootOf(orgId), regionId: u.regionId || 'ast', category: 'prof', start: isoDate(s), end: isoDate(e), leaderId: u.id, initiatorId: u.id, team: [{ userId: u.id, role: 'Руководитель проекта', share: 100 }], desc: '', goal: '', problem: '', participants: '', reach: '', volunteerHours: '', results: '', kpis: [{ name: '', unit: 'чел.', plan: '', fact: '' }], effectType: 'social', effect: '', media: [], partners: '', partnerOrgIds: [] };
}
function validateProject(p, full) {
  const e = [];
  if (!String(p.title || '').trim()) e.push('Название проекта');
  if (!p.orgId) e.push('Организация-инициатор');
  if (!full) return e;
  if (!p.start || !p.end || p.end < p.start) e.push('Сроки: дата завершения не раньше даты начала');
  ['desc', 'goal', 'problem', 'results', 'effect'].forEach((k) => { if (!String(p[k] || '').trim()) e.push({ desc: 'Описание', goal: 'Цель и задачи', problem: 'Проблема', results: 'Фактические результаты', effect: 'Социальный или экономический эффект' }[k]); });
  if (!(+p.participants > 0)) e.push('Количество участников');
  if (!(+p.reach > 0)) e.push('Количество охваченных сотрудников');
  const size = sum(uniq([p.orgId, ...(p.partnerOrgIds || [])]).map(O).filter(Boolean), (o) => o.young);
  if (+p.reach > size) e.push(`Охват (${fmt(p.reach)}) больше численности молодёжи компаний проекта (${fmt(size)})`);
  const goodK = (p.kpis || []).filter((k) => String(k.name).trim() && +k.plan > 0 && k.fact !== '' && +k.fact >= 0);
  if (!goodK.length) e.push('Хотя бы один измеримый KPI с планом и фактом');
  const sh = sum(p.team || [], (x) => +x.share || 0);
  if (sh !== 100) e.push(`Сумма долей вклада команды должна быть 100% (сейчас ${sh}%)`);
  if ((p.team || []).some((x) => !(+x.share > 0))) e.push('У каждого участника команды доля больше 0%');
  if (!(p.team || []).some((x) => x.userId === p.leaderId)) e.push('Руководитель должен входить в команду');
  if (!(p.media || []).some((m) => m.kind !== 'photo')) e.push('Подтверждающий документ (отчёт, список участников, акт)');
  return e;
}

FORMS.project = (form, e) => {

  let x = p.id ? DB.projects.find((y) => y.id === p.id) : null;

route('events', () => {
  const now = new Date();
  const f = (UI.ev = { view: 'calendar', month: isoDate(now).slice(0, 7), root: '', region: '', cat: '', when: 'all', day: null, from: '', to: '', ...(UI.ev || {}) });
  let list = DB.events.filter(canSeeActivity);
  if (f.root) list = list.filter((e) => rootOf(e.orgId) === f.root);
  if (f.region) list = list.filter((e) => e.regionId === f.region);
  if (f.cat) list = list.filter((e) => e.category === f.cat);
  const [yy, mm] = f.month.split('-').map(Number);
  let body = '';
  if (f.view === 'calendar') {
    const first = new Date(yy, mm - 1, 1);
    const startDow = (first.getDay() + 6) % 7;
    const days = new Date(yy, mm, 0).getDate();
    const cells = [];
    for (let i = 0; i < startDow; i++) cells.push(null);
    for (let d = 1; d <= days; d++) cells.push(d);
    while (cells.length % 7) cells.push(null);
    const today = todayISO();
    const dayList = f.day ? list.filter((e) => e.date === f.day) : list.filter((e) => e.date.slice(0, 7) === f.month);
    body = `<div class="cal-head"><button class="icon-btn" data-act="cal-nav" data-d="-1" aria-label="Предыдущий месяц">${icon('chevL')}</button><h2>${MONTHS_FULL[mm - 1]} ${yy}</h2><button class="icon-btn" data-act="cal-nav" data-d="1" aria-label="Следующий месяц">${icon('chevR')}</button><button class="btn sm ghost" data-act="cal-today">Сегодня</button></div>
      <div class="cal" role="grid">${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map((d) => `<span class="cal-dow">${d}</span>`).join('')}${cells.map((d) => {
        if (!d) return '<span class="cal-c empty"></span>';
        const iso = `${yy}-${String(mm).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const evs = list.filter((e) => e.date === iso);
        return `<button class="cal-c ${iso === today ? 'today' : ''} ${f.day === iso ? 'sel' : ''} ${evs.length ? 'has' : ''}" data-act="cal-day" data-d="${iso}" aria-label="${d} ${MONTHS[mm - 1]}: ${evs.length} мероприятий"><b>${d}</b>${evs.slice(0, 2).map((e) => `<span class="cal-e" style="--c:${CAT(e.category).color}">${esc(e.title)}</span>`).join('')}${evs.length > 2 ? `<small>+${evs.length - 2}</small>` : ''}${evs.length ? `<i class="cal-dots">${evs.slice(0, 3).map((e) => `<i style="background:${CAT(e.category).color}"></i>`).join('')}</i>` : ''}</button>`;
      }).join('')}</div>
      <div class="cal-list"><h3>${f.day ? `Мероприятия ${fmtDate(f.day)} <button class="lnk" data-act="clear" data-k="ev.day">весь месяц</button>` : `Все мероприятия месяца · ${dayList.length}`}</h3>${dayList.length ? `<div class="elist">${dayList.sort((a, b) => a.date.localeCompare(b.date)).map(eventRow).join('')}</div>` : '<p class="muted">Нет мероприятий</p>'}</div>`;
  } else {
    let l2 = list.slice();
    if (f.when === 'upcoming') l2 = l2.filter((e) => e.date >= todayISO());
    if (f.when === 'past') l2 = l2.filter((e) => e.date < todayISO());
    if (f.from) l2 = l2.filter((e) => e.date >= f.from);
    if (f.to) l2 = l2.filter((e) => e.date <= f.to);
    l2.sort((a, b) => (f.when === 'past' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date)));
    const groups = {};
    l2.forEach((e) => { const k = e.date.slice(0, 7); (groups[k] = groups[k] || []).push(e); });
    body = `<div class="filters">${seg('ev.when', [['all', 'Все'], ['upcoming', 'Предстоящие'], ['past', 'Прошедшие']], f.when)}<label class="inline">с ${inp('ev-from', f.from, 'type="date" data-live="ev.from"')}</label><label class="inline">по ${inp('ev-to', f.to, 'type="date" data-live="ev.to"')}</label></div>
      ${Object.keys(groups).length ? Object.entries(groups).map(([k, arr]) => { const [y, m] = k.split('-').map(Number); return `<h3 class="grp">${MONTHS_FULL[m - 1]} ${y}</h3><div class="card"><div class="elist">${arr.map(eventRow).join('')}</div></div>`; }).join('') : emptyState('calendar', 'Мероприятий нет', 'Измените фильтры.')}`;
  }
  return `<div class="page">
    ${pageHead(t('events'), 'Календарь мероприятий Молодёжных советов: регистрация участников, итоги и подтверждение', can('event.create') ? `<a class="btn primary" href="#event-new" data-act="event-new">${icon('plus', 16)}Добавить мероприятие</a>` : '')}
    <div class="filters">${seg('ev.view', [['calendar', 'Календарь'], ['list', 'Список']], f.view)}
      ${sel('ev-root', rootOptions('Все организации'), f.root, 'data-live="ev.root"')}
      ${sel('ev-region', regionOptions('Все регионы'), f.region, 'data-live="ev.region"')}
      ${sel('ev-cat', catOptions('Все категории'), f.cat, 'data-live="ev.cat"')}</div>
    ${body}</div>`;
});

        ${f.open === r.orgId ? `<tr class="detail"><td colspan="9"><div class="breakdown cols">${COMPANY_COMPONENTS.map((c) => `<div class="bd" data-tip="${esc(c.hint)}"><span class="bd-l">${esc(c.name)} <small>${DB.settings.wCompany[c.k]}%</small></span>${bar(r.comps[c.k])}<span class="bd-v">${fmt(r.comps[c.k])}<small> → ${fmt1((r.comps[c.k] * DB.settings.wCompany[c.k]) / 100)}</small></span></div>`).join('')}</div></td></tr>` : ''}`; }).join('')}

/* ============================ НЕЗАВИСИМАЯ ЭКСПЕРТИЗА ============================ */
function queueRow(x) {
  const tp = entityType(x);
  const org = entityOrg(x);
  const ex = x.review && U(x.review.expertId);
  const claim = tp === 'project' ? `охват ${fmt(x.reach)} · ${x.kpis.length} KPI` : tp === 'event' ? `пришли ${fmt(x.attended)}` : x.hours ? `${x.hours} ч` : ACH_TYPES[x.type].name;
  return `<a class="qrow" href="#review-${x.id}"><span class="q-ic">${icon(tp === 'project' ? 'folder' : tp === 'event' ? 'calendar' : 'award', 18)}</span><span class="grow"><b>${esc(x.title)}</b><small>${tp === 'project' ? 'Проект' : tp === 'event' ? 'Мероприятие' : 'Личное достижение · ' + esc((U(x.userId) || {}).name || '')} · ${esc(orgLabel(org))} · ${esc(claim)}</small></span><span class="q-side">${statusChip(x.status)}<small class="muted">${fmtDate(x.submittedAt || (x.review && x.review.assignedAt))}${myRole() === 'admin' ? ' · ' + esc(ex ? ex.name : 'без эксперта') : ''}</small></span></a>`;
}
route('expert', () => {
  const u = me();
  const all = [...DB.projects, ...DB.events, ...DB.achievements].filter((x) => x.review || x.status === 'submitted');
  const admin = u.role === 'admin';
  const mine = admin ? all : all.filter((x) => x.review && x.review.expertId === u.id);
  const free = all.filter((x) => x.status === 'submitted' && (!x.review || !x.review.expertId) && !hasConflict(u, entityOrg(x)));
  const tab = UI.tabs.ex || 'new';
  const sets = {
    new: mine.filter((x) => x.status === 'submitted'), work: mine.filter((x) => x.status === 'in_review'),
    info: mine.filter((x) => x.status === 'needs_info'), done: mine.filter((x) => ['confirmed', 'rejected'].includes(x.status)), free
  };
  const list = (sets[tab] || []).sort((a, b) => String(b.submittedAt || '').localeCompare(String(a.submittedAt || '')));
  const decided = sets.done.filter((x) => x.review && x.review.scores);
  const avg = decided.length ? sum(decided, (x) => scoresAvg(x.review.scores)) / decided.length : 0;
  const conflicts = uniq([...(u.conflicts || []), ...(u.companyId ? [u.companyId] : [])]);
  return `<div class="page">
    ${pageHead('Кабинет независимого эксперта', admin ? 'Администратор видит все заявки и может переназначать экспертов.' : 'Проверка доказательств, оценка по критериям и решение по каждой заявке. Все действия фиксируются в журнале аудита.', '', 'Экспертиза')}
    ${!admin ? `<div class="banner info">${icon('shield', 18)}<span><b>Конфликт интересов.</b> Вам не назначаются и не показываются заявки организаций: ${conflicts.length ? conflicts.map((c) => esc(orgLabel(c)) + (O(c) && O(c).type === 'portfolio' && childrenOf(c).length ? ' и её филиалы' : '')).join(', ') : 'нет задекларированных'}. <button class="lnk" data-act="ex-conflicts">Изменить декларацию</button></span></div>` : ''}
    <div class="kpis k4">${kpi('Новые заявки', fmt(sets.new.length), 'ожидают взятия в работу')}${kpi('В работе', fmt(sets.work.length))}${kpi('Ждут уточнений', fmt(sets.info.length), 'у авторов')}${kpi('Решено', fmt(sets.done.length), decided.length ? `средняя оценка ${fmt1(avg)}` : '')}</div>
    ${tabs('tabs.ex', [['new', 'Новые', sets.new.length], ['work', 'В работе', sets.work.length], ['info', 'Требуются уточнения', sets.info.length], ['done', 'Решённые', sets.done.length], ...(admin ? [] : [['free', 'Свободные заявки', free.length]])], tab)}
    ${list.length ? `<div class="card"><div class="qlist">${list.slice(0, 80).map(queueRow).join('')}</div></div>` : emptyState('check', 'Заявок нет', tab === 'new' ? 'Новые заявки появятся, когда авторы отправят активности на проверку.' : 'В этом разделе пусто.')}
  </div>`;
}, guardRoles('expert', 'admin'));
ACTIONS['ex-conflicts'] = () => {
  const u = me();
  openModal({
    title: 'Декларация конфликта интересов', wide: true,
    body: `<p class="note">Отметьте организации, с которыми у вас есть конфликт интересов (место работы, родственники, участие в проектах). Заявки этих организаций и их филиалов вам назначаться не будут.</p><div class="checks">${DB.orgs.filter((o) => o.type !== 'subsidiary').map((o) => `<label class="check"><input type="checkbox" name="cf" value="${o.id}" ${(u.conflicts || []).includes(o.id) || u.companyId === o.id ? 'checked' : ''} ${u.companyId === o.id ? 'disabled' : ''}><span>${esc(o.full)}${u.companyId === o.id ? ' — ваша организация' : ''}</span></label>`).join('')}</div>`,
    actions: [{ label: 'Отмена', cls: 'ghost', fn: closeModal }, { label: 'Сохранить декларацию', cls: 'primary', fn: () => {
      u.conflicts = $$('input[name=cf]:checked:not(:disabled)').map((i) => i.value);
      audit('Изменение декларации конфликта интересов', 'user', u.id, u.conflicts.map(orgLabel).join(', ') || 'нет');
      const moved = [...DB.projects, ...DB.events, ...DB.achievements].filter((x) => x.review && x.review.expertId === u.id && ['submitted', 'in_review'].includes(x.status) && hasConflict(u, entityOrg(x)));
      moved.forEach((x) => { const ex = pickExpert(x, [u.id]); x.review.expertId = ex ? ex.id : null; x.status = 'submitted'; x.history.push({ ts: new Date().toISOString(), actorId: 'system', action: 'Переназначено из-за конфликта интересов' + (ex ? ': ' + ex.name : '') }); if (ex) notify(ex.id, `Новая заявка на проверку: «${x.title}»`, '#review-' + x.id); });
      commit(); closeModal(); toast(moved.length ? `Декларация сохранена, переназначено заявок: ${moved.length}` : 'Декларация сохранена', 'good'); rerender();
    } }]
  });
};

route('review', (id) => {
  const x = findEntity(id);
  if (!x) return ROUTES.notfound.render();
  const u = me();
  const org = entityOrg(x);
  const tp = entityType(x);
  if (u.role === 'expert' && hasConflict(u, org)) {
    if (!UI.cfLogged || UI.cfLogged !== id) { audit('Заблокирован доступ: конфликт интересов', tp, x.id, `${u.name} → ${orgLabel(org)}`); commit(); UI.cfLogged = id; }
    return `<div class="page narrow">${emptyState('lock', 'Конфликт интересов', `Вы не можете проверять активности ${orgLabel(org)}: организация входит в вашу декларацию конфликта интересов. Попытка доступа записана в журнал аудита.`, `<a class="btn" href="#expert">К очереди</a>`)}</div>`;
  }
  if (u.role === 'expert' && x.review && x.review.expertId && x.review.expertId !== u.id) return denied('Заявка назначена другому эксперту.');
  const assigned = x.review && x.review.expertId === u.id;
  const c = CAT(tp === 'achievement' ? ACH_TYPES[x.type].cat : x.category);
  const claim = tp === 'project'
    ? `<dl class="stats2"><div><dt>Участников</dt><dd>${fmt(x.participants)}</dd></div><div><dt>Охват заявлен</dt><dd>${fmt(x.reach)}</dd></div>${x.volunteerHours ? `<div><dt>Волонтёрских часов</dt><dd>${fmt(x.volunteerHours)}</dd></div>` : ''}<div><dt>Численность молодёжи</dt><dd>${fmt(O(x.orgId).young)}</dd></div></dl>
       <div class="tbl-wrap"><table class="tbl"><thead><tr><th>KPI</th><th class="num">План</th><th class="num">Факт</th><th class="num">%</th></tr></thead><tbody>${x.kpis.map((k) => `<tr><td>${esc(k.name)} <small class="muted">${esc(k.unit)}</small></td><td class="num">${fmt(k.plan)}</td><td class="num">${fmt(k.fact)}</td><td class="num">${k.plan ? fmt((k.fact / k.plan) * 100) : '—'}</td></tr>`).join('')}</tbody></table></div>
       <dl class="dl1"><div><dt>Проблема</dt><dd>${esc(x.problem)}</dd></div><div><dt>Результаты</dt><dd>${esc(x.results)}</dd></div><div><dt>Эффект</dt><dd>${esc(x.effect)}</dd></div></dl>
       <h3 class="fs">Команда и доли вклада</h3><div class="team">${x.team.map((t0) => `<div class="tm">${avatar(U(t0.userId), 30)}<span class="grow"><b>${esc(U(t0.userId).name)}</b><small>${esc(t0.role)} · ${esc(orgLabel(U(t0.userId).companyId))}</small></span><span class="share">${t0.share}%</span></div>`).join('')}</div>`
    : tp === 'event'
      ? `<dl class="stats2"><div><dt>Зарегистрировано</dt><dd>${x.registered.length}</dd></div><div><dt>Пришли (заявлено)</dt><dd>${fmt(x.attended)}</dd></div><div><dt>Лимит</dt><dd>${x.capacity}</dd></div></dl><p>${esc(x.summary)}</p>`
      : `<dl class="stats2"><div><dt>Сотрудник</dt><dd>${userLink(U(x.userId))}</dd></div><div><dt>Дата</dt><dd>${fmtDate(x.date)}</dd></div>${x.hours ? `<div><dt>Часов заявлено</dt><dd>${x.hours}</dd></div>` : ''}<div><dt>Организация</dt><dd>${esc(x.org || '—')}</dd></div></dl><p>${esc(x.desc)}</p>`;
  const media = tp === 'achievement' ? x.files : x.media;
  const R = x.review || {};
  if (assigned && x.status === 'in_review' && (!UI.rv || UI.rv.id !== x.id)) {
    UI.rv = { id: x.id, scores: { ...(R.scores || { relevance: 7, results: 7, evidence: 7, reach: 7, kpi: 7 }) }, verifiedReach: R.verifiedReach ?? x.reach ?? '', verifiedAttended: R.verifiedAttended ?? x.attended ?? '', verifiedHours: R.verifiedHours ?? x.volunteerHours ?? x.hours ?? '', comment: '' };
  }
  const crit = [['relevance', 'Актуальность и соответствие цели', 'Насколько активность решает заявленную проблему молодёжи'], ['results', 'Достигнутые результаты', 'Измеримость и значимость фактических результатов'], ['evidence', 'Качество доказательств', 'Документы, списки участников, акты. Количество фото не оценивается'], ['reach', 'Подтверждённый охват', 'Соответствие охвата спискам и численности'], ['kpi', 'Выполнение KPI', 'Соотношение плана и факта']];
  let panel = '';
  if (x.status === 'submitted' && (assigned || !R.expertId || u.role === 'admin')) {
    panel = `<p class="note">Перед оценкой возьмите заявку в работу — автор получит уведомление.</p><div class="btn-row"><button class="btn primary" data-act="rv-take" data-id="${x.id}">${icon('check', 16)}Взять в работу</button>${u.role === 'expert' ? `<button class="btn ghost" data-act="rv-decline" data-id="${x.id}">Заявить конфликт интересов</button>` : ''}</div>`;
  } else if (x.status === 'in_review' && assigned) {
    const r = UI.rv;
    const avg = scoresAvg(r.scores);
    panel = `<form class="form" data-form="review" data-id="${x.id}">

function analyticsScope() {
  const u = me(); const f = UI.an;
  let orgIds = DB.orgs.map((o) => o.id); let region = f.region; let label = 'Вся группа';
  if (u.role === 'chair') { orgIds = familyOf(rootOf(u.companyId)); label = groupName(O(rootOf(u.companyId))); }
  else if (u.role === 'regional') { region = u.regionId; label = RG(u.regionId).name + ' · все компании'; }
  else if (f.root) { orgIds = familyOf(f.root); label = groupName(O(f.root)); }
  if (region && u.role !== 'regional') label += ' · ' + RG(region).name;
  return { orgIds: new Set(orgIds), region, label };
}
function analyticsData(range) {
  const sc = analyticsScope();
  const inScope = (orgId, regionId) => sc.orgIds.has(orgId) && (!sc.region || regionId === sc.region);
  const projects = DB.projects.filter((p) => inScope(p.orgId, p.regionId));
  const events = DB.events.filter((e) => inScope(e.orgId, e.regionId));
  const achs = DB.achievements.filter((a) => { const u = U(a.userId); return u && inScope(u.companyId, u.regionId); });
  const cp = projects.filter((p) => p.status === 'confirmed' && inRange(p.end, range));
  const ce = events.filter((e) => e.status === 'confirmed' && inRange(e.date, range));
  const ca = achs.filter((a) => a.status === 'confirmed' && inRange(a.date, range));
  const young = sum([...sc.orgIds].map(O), (o) => o.young);
  const reach = sum(cp, verifiedReach) + sum(ce, verifiedAtt);
  const reachBy = {}; cp.forEach((p) => { reachBy[p.orgId] = (reachBy[p.orgId] || 0) + verifiedReach(p); }); ce.forEach((e) => { reachBy[e.orgId] = (reachBy[e.orgId] || 0) + verifiedAtt(e); });
  const unique = Math.round(sum([...sc.orgIds], (id) => (O(id) ? O(id).young * uniqueShare(reachBy[id] || 0, O(id).young) : 0)));
  const hours = sum(cp, (p) => p.review.verifiedHours || 0) + sum(ca.filter((a) => a.hours), (a) => a.review?.verifiedHours ?? a.hours);
  const activeOrgs = new Set([...cp.map((p) => p.orgId), ...ce.map((e) => e.orgId)]);
  const scores = companyScores({ ...range, region: sc.region }).filter((r) => sc.orgIds.has(r.orgId));
  return { sc, projects, events, achs, cp, ce, ca, young, reach, unique, hours, activeOrgs, scores, inter: cp.filter(hasPartners).length, attendees: sum(ce, verifiedAtt) };
}
function quarterList(n = 6) {
  const out = []; const d = new Date();
  let q = Math.floor(d.getMonth() / 3), y = d.getFullYear();
  for (let i = 0; i < n; i++) {
    const from = `${y}-${String(q * 3 + 1).padStart(2, '0')}-01`;
    const endD = new Date(y, q * 3 + 3, 0);
    out.unshift({ id: `${y}-Q${q + 1}`, label: `${['I', 'II', 'III', 'IV'][q]} кв. ${y}`, from, to: isoDate(endD) });
    q--; if (q < 0) { q = 3; y--; }
  }
  return out;
}

      ${kpi('Активных Молодёжных советов', `${A.activeOrgs.size} <small>из ${A.sc.orgIds.size}</small>`, 'с подтверждённой активностью', 'flag')}
      ${kpi('Реализованных проектов', fmt(A.cp.length), 'подтверждено', 'folder')}
      ${kpi('Мероприятий', fmt(A.ce.length), 'проведено и подтверждено', 'calendar')}
      ${kpi('Участников мероприятий', fmt(A.attendees), 'подтверждено экспертами', 'users')}
      ${kpi('Уникальных охваченных', fmt(A.unique), 'в пределах численности', 'user')}
      ${kpi('Волонтёрских часов', fmt(A.hours), 'проекты и личные', 'hand')}
      ${kpi('Межкорпоративных проектов', fmt(A.inter), 'с компаниями группы', 'link')}
      ${kpi('Подтверждённых инициатив', fmt(A.cp.length + A.ca.length), 'проекты и личные достижения', 'check')}

async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) { const msg = error.message || 'Ошибка сервера'; toast(msg, 'bad'); throw new Error(msg); }
  return data;
}
async function tbl(op) {
  const { data, error } = await op;
  if (error) { const msg = error.message || 'Ошибка сервера'; toast(msg, 'bad'); throw new Error(msg); }
  return data;
}
async function fetchAll(table, order) {
  let out = [];
  for (let from = 0; ; from += 1000) {
    let q = sb.from(table).select('*');
    if (order) q = q.order(order, { ascending: false });
    const { data, error } = await q.range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
  }
  return out;
}
async function busy(fn) {
  if (LIVE_BUSY) return;
  LIVE_BUSY = true; document.body.classList.add('busy');
  try { return await fn(); } catch (e) { console.error(e); } finally { LIVE_BUSY = false; document.body.classList.remove('busy'); }
}
function putRow(kind, row) {
  const map = { project: [DB.projects, ROW.project], event: [DB.events, ROW.event], achievement: [DB.achievements, ROW.achievement] }[kind];
  const obj = map[1](row);
  if (kind === 'project') obj.companyId = rootOf(obj.orgId);
  const i = map[0].findIndex((x) => x.id === obj.id);
  if (i >= 0) map[0][i] = obj; else map[0].push(obj);
  commit();
  return obj;
}
function putUser(row) {
  const obj = ROW.user(row);
  const old = U(obj.id); if (old && old.email) obj.email = old.email;
  const i = DB.users.findIndex((x) => x.id === obj.id);
  if (i >= 0) DB.users[i] = obj; else DB.users.push(obj);
  commit();
  return obj;
}
async function refetch(kind, id) {
  const row = await tbl(sb.from(KIND_LIST[kind]).select('*').eq('id', id).maybeSingle());
  if (row) return putRow(kind, row);
  return null;
}

function ratingDiffRows(before, after, reason) {
  const ts = new Date().toISOString(); const rows = [];
  after.c.forEach((v, id) => { const b = before.c.get(id) || { t: 0, r: null }; if (Math.abs(v.t - b.t) >= 0.05 || v.r !== b.r) rows.push({ ts, kind: 'org', id, from: b.t, to: v.t, rankFrom: b.r, rankTo: v.r, reason }); });
  after.p.forEach((v, id) => { const b = before.p.get(id) || { t: 0, r: null }; if (Math.abs(v.t - b.t) >= 0.05) rows.push({ ts, kind: 'person', id, from: b.t, to: v.t, rankFrom: b.r, rankTo: v.r, reason }); });
  return rows;
}

/* ---------- файлы в хранилище ---------- */
function splitKey(key) { const i = key.indexOf('/'); return { bucket: key.slice(0, i), path: key.slice(i + 1) }; }
function installLiveMedia() {
  MEDIA.put = async (key, blob) => {
    MEDIA.mem.set(key, blob);
    if (!/^(files|avatars)\//.test(key)) return;
    const { bucket, path } = splitKey(key);
    const { error } = await sb.storage.from(bucket).upload(path, blob, { upsert: false, contentType: blob.type || undefined });
    if (error) throw new Error(error.message);
  };
  MEDIA.get = async (key) => {
    if (MEDIA.mem.has(key)) return MEDIA.mem.get(key);
    if (!/^(files|avatars)\//.test(key)) return null;
    const { bucket, path } = splitKey(key);
    const { data, error } = await sb.storage.from(bucket).download(path);
    return error ? null : data;
  };
  MEDIA.url = async (key) => {
    if (MEDIA.urls.has(key)) return MEDIA.urls.get(key);
    let u = null;
    if (MEDIA.mem.has(key)) u = URL.createObjectURL(MEDIA.mem.get(key));
    else if (/^avatars\//.test(key)) u = sb.storage.from('avatars').getPublicUrl(splitKey(key).path).data.publicUrl;
    else if (/^files\//.test(key) && me()) { const { data } = await sb.storage.from('files').createSignedUrl(splitKey(key).path, 3600); u = data ? data.signedUrl : null; }
    if (u) MEDIA.urls.set(key, u);
    return u;
  };
  MEDIA.clear = async () => { MEDIA.mem.clear(); MEDIA.urls.clear(); };
}

function authError(m) {
  const s = String(m || '');
  if (/Invalid login credentials/i.test(s)) return 'Неверный e-mail или пароль';
  if (/already registered|already been registered/i.test(s)) return 'Пользователь с таким e-mail уже зарегистрирован';
  if (/Email not confirmed/i.test(s)) return 'E-mail не подтверждён. Администратору нужно отключить подтверждение почты в настройках Supabase';
  if (/not authorized|Error sending confirmation/i.test(s)) return 'Сервер не может отправить письмо подтверждения. Администратору нужно отключить подтверждение e-mail в Supabase';
  if (/Password should be/i.test(s)) return 'Пароль слишком короткий';
  if (/rate limit/i.test(s)) return 'Слишком много попыток, попробуйте через минуту';
  return s || 'Ошибка входа';
}

function installLiveActions() {
  saveDB = function () { try { localStorage.setItem('jastar-lang', DB.lang); } catch (e) { /* не критично */ } };
  audit = function (action, entityType, entityId, details) {
    DB.audit.push({ id: uid('l'), ts: new Date().toISOString(), actorId: me() ? me().id : 'guest', role: myRole(), action, entityType, entityId, details: details || '' });
    liveAuditLocal(action, entityType, entityId, details);
  };
  notify = function (userId, text, link) {
    if (!userId) return;
    if (me() && userId === me().id) DB.notifications.push({ id: uid('nt'), userId, ts: new Date().toISOString(), text, link: link || '', read: false });
    liveNotify([{ user_id: userId, text, link: link || '' }]);
  };

  /* вход, выход, демо-переключатель */
  ACTIONS['role-switch'] = () => go(me() ? 'me' : 'login');
  ACTIONS['demo-login'] = () => {};
  ACTIONS['demo-logout'] = ACTIONS.logout = () => busy(async () => { await api.signOut(); toast('Вы вышли из системы'); go('home'); });
  route('login', () => `<div class="page narrow"><section class="card pad auth-one">${pageHead(t('login'), 'Войдите по e-mail и паролю, указанным при регистрации')}
    <form class="form" data-form="login">${fld('E-mail', inp('email', '', 'type="email" required autocomplete="email"'), '', true)}${fld('Пароль', inp('password', '', 'type="password" required autocomplete="current-password"'), '', true)}<div class="btn-row"><button class="btn primary" type="submit">${icon('login', 16)}Войти</button><a class="btn ghost" href="#register">Регистрация</a></div></form>
    <p class="note">Забыли пароль? Обратитесь к администратору платформы.</p></section></div>`);
  FORMS.login = (form) => busy(async () => {
    const d = formData(form);
    try { await api.signIn(d.email, d.password); toast('Добро пожаловать, ' + (me().name.split(' ')[1] || me().name), 'good'); go('home'); }
    catch (err) { toast(err.message, 'bad'); }
  });
  const regForm = FORMS.register;
  FORMS.register = (form, e) => {
    if (UI.reg && UI.reg.step === 4) return busy(async () => {
      try {
        const x = UI.reg.data;
        await api.signUp({ ...x, skills: String(x.skills || '').split(',').map((s) => s.trim()).filter(Boolean) });
        UI.reg = null; toast('Профиль создан. Председатель совета подтвердит ваше членство.', 'good'); go('me');
      } catch (err) { toast(err.message, 'bad'); }
    });
    return regForm(form, e);
  };

  /* профиль */
  FORMS.profile = (form) => busy(async () => {
    const d = formData(form); const u = me();
    if (!d.name || !d.position) { toast('Заполните ФИО и должность', 'bad'); return; }
    if (d.pc_email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.pc_email)) { toast('Проверьте рабочий e-mail', 'bad'); return; }
    const data = { ...userData(u), contacts: { email: d.pc_email || '', phone: d.pc_phone || '', telegram: d.pc_tg || '' }, name: d.name, position: d.position, dept: d.dept, city: d.city, startYear: +d.startYear || u.startYear, bio: d.bio, education: d.education, interests: d.interests, skills: String(d.skills || '').split(',').map((x) => x.trim()).filter(Boolean), sport: d.sport };
    const org = d.companyId && d.companyId !== u.companyId ? d.companyId : null;
    putUser(await rpc('update_my_profile', { d: data, org, region: d.regionId || null }));
    UI.meRoot = null; toast('Профиль сохранён', 'good'); go('me');
  });
  UPLOAD.avatar = async (files) => {
    const f = files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) { toast('Нужен файл изображения', 'bad'); return; }
    const blob = await resizeImage(f, 400, 0.86);
    if (!me()) { const key = uid('ava'); MEDIA.mem.set(key, blob); if (UI.reg) { UI.reg.data.photo = key; rerender(); } return; }
    await busy(async () => {
      const key = newMediaKey('avatar.jpg', 'avatar');
      await MEDIA.put(key, blob);
      const u = me(); putUser(await rpc('update_my_profile', { d: { ...userData(u), photo: key }, org: null, region: null }));
      toast('Фотография обновлена', 'good'); rerender();
    });
  };
  UPLOAD['user-media'] = (files) => busy(async () => {
    const u = me(); const kind = UI.umKind || 'photo';
    const items = await acceptFiles(files, kind === 'photo' ? {} : { kind: kind === 'video' ? 'video' : 'doc' });
    items.forEach((m) => { m.cat = kind; if (kind === 'photo' && m.type && !m.type.startsWith('image/')) m.kind = 'doc'; });
    if (!items.length) return;
    putUser(await rpc('update_my_profile', { d: { ...userData(u), media: [...(u.media || []), ...items] }, org: null, region: null }));
    toast(`Загружено файлов: ${items.length}`, 'good'); rerender();
  });
  const mediaRemove = ACTIONS['media-remove'];
  ACTIONS['media-remove'] = (el) => {
    const id = el.dataset.id; const u = me();
    if (u && (u.media || []).some((m) => m.id === id) && !(UI.pf && UI.pf.media && UI.pf.media.some((m) => m.id === id))) {
      return busy(async () => { putUser(await rpc('update_my_profile', { d: { ...userData(u), media: u.media.filter((m) => m.id !== id) }, org: null, region: null })); rerender(); });
    }
    return mediaRemove(el);
  };

  /* совет */
  ACTIONS['member-verify'] = (el) => busy(async () => { putUser(await rpc('verify_member', { uid: el.dataset.id, accept: true })); toast('Членство подтверждено', 'good'); rerender(); });
  ACTIONS['member-reject'] = (el) => {
    const u = U(el.dataset.id);
    confirmModal('Отклонить заявку?', `${u.name} не будет включён в состав совета. Профиль сотрудника сохранится.`, 'Отклонить', () => busy(async () => { putUser(await rpc('verify_member', { uid: u.id, accept: false })); rerender(); }), true);
  };
  ACTIONS['council-role'] = (el) => busy(async () => {
    try { putUser(await rpc('set_council_role', { uid: el.dataset.id, cr: el.value })); toast('Должность обновлена', 'good'); } catch (e) { rerender(); }
  });
  ACTIONS['company-edit'] = (el) => {
    const o = O(el.dataset.id);
    openModal({
      title: 'Профиль компании', body: `<form class="form">${fld('Описание компании и совета', txa('co-about', o.about, 6))}${fld('Отрасль', inp('co-sector', o.sector))}${fld('Год создания совета', inp('co-founded', o.council.founded || '', 'type="number" min="1990" max="2030"'))}</form>`,
      actions: [{ label: 'Отмена', cls: 'ghost', fn: closeModal }, { label: 'Сохранить', cls: 'primary', fn: () => busy(async () => {
        const row = await rpc('update_org_profile', { o: o.id, about: $('#co-about').value.trim(), sector: $('#co-sector').value.trim(), founded: +$('#co-founded').value || null });
        const i = DB.orgs.findIndex((x) => x.id === o.id); DB.orgs[i] = ROW.org(row); commit(); closeModal(); toast('Профиль компании сохранён', 'good'); rerender();
      }) }]
    });
  };

  /* личные достижения */
  FORMS.achievement = (form, e) => busy(async () => {
    const mode = (e.submitter && e.submitter.value) || 'draft'; const a = UI.af;
    const errs = [];
    if (!a.title.trim()) errs.push('название');
    if (mode === 'submit') { if ((a.type === 'volunteer' || a.type === 'social') && !(+a.hours > 0)) errs.push('количество часов'); if (!a.files.length) errs.push('подтверждающий документ'); }
    if (errs.length) { toast('Заполните: ' + errs.join(', '), 'bad'); return; }
    const payload = { id: a.id || uid('a'), type: a.type, title: a.title.trim(), date: a.date, hours: +a.hours || 0, org: a.org, desc: a.desc, files: a.files };
    if (mode === 'submit') { const dup = findDuplicate({ ...payload, userId: me().id }); if (dup) { toast('Такое достижение уже учтено: одна активность не засчитывается дважды', 'bad'); return; } }
    let row = await rpc('save_achievement', { a: payload });
    if (mode === 'submit') row = await rpc('submit_activity', { kind: 'achievement', eid: payload.id });
    putRow('achievement', row);
    UI.af = null; toast(mode === 'submit' ? 'Отправлено на проверку независимому эксперту' : 'Черновик сохранён', 'good');
    UI.tabs['pr-' + me().id] = 'mine'; go('me');
  });
  ACTIONS.appeal = (el) => {
    const x = findEntity(el.dataset.id); const kind = entityType(x);
    openModal({
      title: 'Оспорить оценку', body: `<p class="lead">«${esc(x.title)}» — ${esc(STATUS[x.status].label.toLowerCase())}.</p><p class="note">Апелляцию рассматривает администратор. При обоснованных доводах назначается повторная экспертиза другим экспертом.</p>${fld('Основание для пересмотра', txa('ap-reason', '', 4), '', true)}`,
      actions: [{ label: 'Отмена', cls: 'ghost', fn: closeModal }, { label: 'Подать апелляцию', cls: 'primary', fn: () => busy(async () => {
        const row = await rpc('create_appeal', { kind, eid: x.id, reason: $('#ap-reason').value.trim() });
        DB.appeals.push(ROW.appeal(row)); await refetch(kind, x.id); closeModal(); toast('Апелляция отправлена администратору', 'good'); rerender();
      }) }]
    });
  };

  /* уведомления */
  ACTIONS['notif-read-all'] = () => busy(async () => { await tbl(sb.from('notifications').update({ read: true }).eq('user_id', me().id)); myNotifications().forEach((n) => { n.read = true; }); commit(); rerender(); });
  ACTIONS['notif-open'] = (el) => { const n = DB.notifications.find((x) => String(x.id) === el.dataset.id); if (n && !n.read) { n.read = true; commit(); sb.from('notifications').update({ read: true }).eq('id', n.id).then(() => {}, () => {}); } go((n && n.link ? n.link : '#notifications').slice(1)); };

  /* проекты */
  FORMS.comment = (form) => busy(async () => { const text = formData(form).text; if (!text) return; putRow('project', await rpc('add_comment', { eid: form.dataset.id, txt: text })); rerender(); });
  ACTIONS['project-submit'] = (el) => {
    const p = DB.projects.find((x) => x.id === el.dataset.id);
    const errs = validateProject(p, true);
    if (errs.length) { UI.pf = JSON.parse(JSON.stringify(p)); UI.pfErrors = errs; go('project-edit-' + p.id); toast('Заполните обязательные поля перед отправкой', 'bad'); return; }
    return busy(async () => { putRow('project', await rpc('submit_activity', { kind: 'project', eid: p.id })); toast('Проект отправлен независимому эксперту', 'good'); rerender(); });
  };
  FORMS.project = (form, e) => busy(async () => {
    const mode = (e.submitter && e.submitter.value) || 'draft'; const p = UI.pf;
    p.team.forEach((x) => { x.share = +x.share || 0; });
    const errs = validateProject(p, mode === 'submit');
    if (errs.length) { UI.pfErrors = errs; rerender(); window.scrollTo(0, 0); toast('Проверьте обязательные поля', 'bad'); return; }
    const payload = { title: p.title, orgId: p.orgId, regionId: p.regionId, category: p.category, start: p.start, end: p.end, leaderId: p.leaderId, initiatorId: p.initiatorId, team: p.team, desc: p.desc, goal: p.goal, problem: p.problem, participants: +p.participants || 0, reach: +p.reach || 0, volunteerHours: +p.volunteerHours || 0, results: p.results, kpis: p.kpis.filter((k) => String(k.name).trim()).map((k) => ({ ...k, plan: +k.plan || 0, fact: +k.fact || 0 })), effectType: p.effectType, effect: p.effect, media: p.media, partners: p.partners, partnerOrgIds: p.partnerOrgIds, id: p.id || uid('p') };
    if (mode === 'submit') { const dup = findDuplicate({ ...payload, id: payload.id }); if (dup) { UI.pfErrors = [`Похожий проект уже учтён: «${dup.title}» (${orgLabel(dup.orgId)}). Одна активность не засчитывается дважды.`]; rerender(); return; } }
    let row = await rpc('save_project', { p: payload });
    if (mode === 'submit') { try { row = await rpc('submit_activity', { kind: 'project', eid: payload.id }); } catch (err) { putRow('project', row); UI.pf = null; go('project-' + payload.id); return; } }
    putRow('project', row);
    UI.pf = null; UI.pfErrors = null; UI.pfOrg = null;
    toast(mode === 'submit' ? 'Проект отправлен на проверку независимому эксперту' : 'Черновик сохранён', 'good');
    go('project-' + payload.id);
  });

  /* мероприятия */
  ACTIONS['ev-reg'] = (el) => busy(async () => { putRow('event', await rpc('event_register', { eid: el.dataset.id, on_: true })); toast('Вы зарегистрированы', 'good'); rerender(); });
  ACTIONS['ev-unreg'] = (el) => busy(async () => { putRow('event', await rpc('event_register', { eid: el.dataset.id, on_: false })); toast('Регистрация отменена'); rerender(); });
  const eventPayload = (e) => ({ id: e.id, title: e.title, orgId: e.orgId, regionId: e.regionId, date: e.date, time: e.time, place: e.place, category: e.category, desc: e.desc, organizers: e.organizers, capacity: +e.capacity || 50, attended: +e.attended || 0, summary: e.summary || '', media: e.media || [] });
  FORMS['ev-report'] = (form) => busy(async () => {
    const e = DB.events.find((x) => x.id === form.dataset.id); const r = UI.evr;
    const errs = [];
    if (!(+r.attended > 0)) errs.push('количество пришедших');
    if (!String(r.summary).trim()) errs.push('итоги');
    if (!r.media.some((m) => m.kind !== 'photo')) errs.push('лист регистрации (документ)');
    if (errs.length) { toast('Заполните: ' + errs.join(', '), 'bad'); return; }
    await rpc('save_event', { e: eventPayload({ ...e, attended: +r.attended, summary: r.summary, media: r.media }) });
    putRow('event', await rpc('submit_activity', { kind: 'event', eid: e.id }));
    UI.evr = null; toast('Итоги отправлены на подтверждение эксперту', 'good'); rerender();
  });
  FORMS.event = () => busy(async () => {
    const e = UI.ef; const u = me();
    if (!e.title.trim() || !e.date || !e.place.trim()) { toast('Заполните название, дату и место', 'bad'); return; }
    if (u.role === 'regional' && e.regionId !== u.regionId) { toast('Региональный председатель добавляет мероприятия только своего региона', 'bad'); return; }
    const id = e.id || uid('e');
    if (!e.id) { const dup = findDuplicate({ ...e, id }); if (dup) { toast(`Такое мероприятие уже есть: «${dup.title}», ${fmtDate(dup.date)}`, 'bad'); return; } }
    putRow('event', await rpc('save_event', { e: eventPayload({ ...e, id }) }));
    UI.ef = null; toast('Мероприятие сохранено', 'good'); go('event-' + id);
  });

  /* экспертиза */
  ACTIONS['ex-conflicts'] = () => {
    const u = me();
    openModal({
      title: 'Декларация конфликта интересов', wide: true,
      body: `<p class="note">Отметьте организации, с которыми у вас есть конфликт интересов. Заявки этих организаций и их филиалов вам назначаться не будут.</p><div class="checks">${DB.orgs.filter((o) => o.type !== 'subsidiary').map((o) => `<label class="check"><input type="checkbox" name="cf" value="${o.id}" ${(u.conflicts || []).includes(o.id) || u.companyId === o.id ? 'checked' : ''} ${u.companyId === o.id ? 'disabled' : ''}><span>${esc(o.full)}${u.companyId === o.id ? ' — ваша организация' : ''}</span></label>`).join('')}</div>`,
      actions: [{ label: 'Отмена', cls: 'ghost', fn: closeModal }, { label: 'Сохранить декларацию', cls: 'primary', fn: () => busy(async () => {
        const n = await rpc('set_my_conflicts', { orgs: $$('input[name=cf]:checked:not(:disabled)').map((i) => i.value) });
        await liveLoad(); closeModal(); toast(n ? `Декларация сохранена, переназначено заявок: ${n}` : 'Декларация сохранена', 'good'); rerender();
      }) }]
    });
  };
  ACTIONS['rv-take'] = (el) => busy(async () => { const x = findEntity(el.dataset.id); putRow(entityType(x), await rpc('review_take', { kind: entityType(x), eid: x.id })); UI.rv = null; toast('Заявка взята в работу', 'good'); rerender(); });
  ACTIONS['rv-decline'] = (el) => {
    const x = findEntity(el.dataset.id);
    confirmModal('Заявить конфликт интересов?', 'Заявка будет передана другому эксперту без конфликта. Действие фиксируется в журнале аудита.', 'Передать заявку', () => busy(async () => { await rpc('review_decline', { kind: entityType(x), eid: x.id }); await liveLoad(); go('expert'); }));
  };
  FORMS.review = (form, e) => {
    const x = findEntity(form.dataset.id); const r = UI.rv; const d = (e.submitter && e.submitter.value) || 'confirmed'; const kind = entityType(x);
    if (d !== 'confirmed' && String(r.comment || '').trim().length < 10) { toast('Опишите причину в комментарии (от 10 знаков)', 'bad'); return; }
    const rv = { scores: kind === 'achievement' ? { relevance: 8, results: 8, evidence: 8, reach: 8, kpi: 8 } : Object.fromEntries(Object.entries(r.scores).map(([k, v]) => [k, +v])), comment: String(r.comment || '').trim() };
    if (kind === 'project') { rv.verifiedReach = Math.max(0, +r.verifiedReach || 0); if (x.volunteerHours) rv.verifiedHours = Math.max(0, +r.verifiedHours || 0); }
    if (kind === 'event') rv.verifiedAttended = Math.max(0, +r.verifiedAttended || 0);
    if (kind === 'achievement' && x.hours) rv.verifiedHours = Math.max(0, Math.min(+r.verifiedHours || 0, x.hours));
    const run = () => busy(async () => {
      const before = snapshotRatings();
      const labels = { confirmed: 'Подтверждено экспертом', rejected: 'Отклонено экспертом', needs_info: 'Запрошены уточнения' };
      const obj = putRow(kind, await rpc('review_decide', { kind, eid: x.id, decision: d, rv }));
      const after = snapshotRatings();
      const rows = ratingDiffRows(before, after, `${labels[d]}: «${obj.title}»`);
      await logRating(rows);
      const texts = { confirmed: 'подтверждена', rejected: 'отклонена', needs_info: 'требует уточнений' };
      const people = uniq([...entityOwners(obj), ...(kind === 'project' ? obj.team.map((t0) => t0.userId) : [])]);
      const notes = people.map((id) => {
        let msg = `Активность «${obj.title}» ${texts[d]}.`;
        const ch = rows.find((z) => z.kind === 'person' && z.id === id);
        if (ch) msg += ch.from < 0.05 ? ` Вы вошли в рейтинг: ${fmt1(ch.to)} баллов, место ${ch.rankTo}.` : ` Ваш рейтинг: ${fmt1(ch.from)} → ${fmt1(ch.to)} баллов` + (ch.rankFrom && ch.rankTo ? `, место ${ch.rankFrom} → ${ch.rankTo}.` : '.');
        return { user_id: id, text: msg, link: entityLink(obj) };
      });
      const org = O(entityOrg(obj)); if (org && org.council.chairId && !people.includes(org.council.chairId)) notes.push({ user_id: org.council.chairId, text: `Активность совета «${obj.title}» ${texts[d]}.`, link: entityLink(obj) });
      await liveNotify(notes);
      UI.rv = null;
      const oc = rows.find((z) => z.kind === 'org' && z.id === entityOrg(obj));
      toast(d === 'confirmed' ? `Подтверждено. ${oc ? `${orgLabel(oc.id)}: ${fmt1(oc.from)} → ${fmt1(oc.to)} баллов.` : ''} Рейтинги пересчитаны.` : d === 'rejected' ? 'Активность отклонена, автор уведомлён' : 'Автору отправлен запрос уточнений', 'good');
      go('expert');
    });
    if (d === 'rejected') confirmModal('Отклонить активность?', 'Автор получит уведомление с вашим комментарием и сможет подать апелляцию.', 'Отклонить', run, true); else run();
  };

  /* новости и база знаний */
  ACTIONS['news-toggle'] = (el) => busy(async () => { const n = DB.news.find((x) => x.id === el.dataset.id); await tbl(sb.from('news').update({ published: !n.published }).eq('id', n.id)); n.published = !n.published; audit(n.published ? 'Публикация материала' : 'Снятие материала с публикации', 'news', n.id, n.title); commit(); rerender(); });
  ACTIONS['news-new'] = () => {
    const u = me();
    const orgs = u.role === 'admin' ? DB.orgs : DB.orgs.filter((o) => rootOf(o.id) === rootOf(u.companyId));
    UI.nf = { cover: null };
    openModal({
      title: 'Новый материал', wide: true,
      body: `<form class="form"><div class="form-grid">${fld('Тип материала', sel('nf-kind', Object.entries(NEWS_KINDS), 'news'))}${fld('Организация', sel('nf-org', orgs.map((o) => [o.id, o.name]), u.companyId && orgs.some((o) => o.id === u.companyId) ? u.companyId : orgs[0].id))}</div>${fld('Заголовок', inp('nf-title', '', 'maxlength="120" required'), '', true)}${fld('Лид', txa('nf-lead', '', 2, 'maxlength="240"'), 'Одно-два предложения о главном', true)}${fld('Текст', txa('nf-body', '', 7), 'Абзацы разделяйте пустой строкой', true)}<label class="drop">${icon('image', 20)}<span><b id="nf-cover-l">Обложка (необязательно)</b><small>JPG или PNG</small></span><input type="file" accept="image/*" hidden data-upload="news-cover"></label></form>`,
      actions: [{ label: 'Отмена', cls: 'ghost', fn: closeModal }, { label: 'Опубликовать', cls: 'primary', fn: () => busy(async () => {
        const title = $('#nf-title').value.trim(), lead = $('#nf-lead').value.trim(), body = $('#nf-body').value.trim();
        if (!title || !lead || !body) { toast('Заполните заголовок, лид и текст', 'bad'); return; }
        const id = uid('n');
        const row = { id, org_id: $('#nf-org').value, author_id: u.id, kind: $('#nf-kind').value, published: true, news_date: todayISO(), data: { title, lead, body: body.split(/\n\s*\n/).map((s) => s.trim()).filter(Boolean), cover: UI.nf.cover, views: 0 } };

  const fbRows = (S.feedback || []).map((f) => ({ id: 'fbdemo' + f.id, user_id: f.userId, kind: f.kind, subject: f.subject || '', body: f.body, section: f.section, target_type: f.targetType, target_id: f.targetId, is_public: f.isPublic, status: f.status, reply: f.reply || '', replied_by: f.repliedBy ? me().id : null, replied_at: f.repliedAt, contact: f.contact || {}, is_demo: true, created_at: f.createdAt }));

  const batches = [['profiles', profiles], ['projects', projects], ['events', events], ['achievements', achs], ['news', news], ['knowledge', kb], ['appeals', appeals], ['feedback', fbRows]];
  for (const [table, rows] of batches) {
    for (let i = 0; i < rows.length; i += 100) await tbl(sb.from(table).insert(rows.slice(i, i + 100)));
  }

  for (const o of S.orgs) {

const FBAPI = {
  async submit(f) {
    if (LIVE) {
      const row = await rpc('submit_feedback', { f });
      const obj = ROW.feedback(row); fbList().push(obj); commit(); return obj;
    }
    const u = me();
    const body = String(f.body || '').trim();
    if (!FB_KINDS[f.kind]) throw new Error('Выберите тип обращения');
    if (body.length < 10) throw new Error('Опишите обращение подробнее (от 10 знаков)');
    if (body.length > 3000) throw new Error('Сообщение слишком длинное (до 3000 знаков)');
    const x = { id: uid('fb'), userId: null, kind: f.kind, subject: String(f.subject || '').trim().slice(0, 150), body, section: f.section || null, targetType: null, targetId: null, isPublic: false, status: 'new', reply: '', repliedBy: null, repliedAt: null, contact: {}, createdAt: new Date().toISOString() };
    if (f.kind === 'thanks') {
      if (!u) throw new Error('Войдите, чтобы поблагодарить: адресат должен знать, от кого благодарность');
      if (!['user', 'org', 'platform'].includes(f.targetType)) throw new Error('Выберите, кого вы благодарите');
      if (f.targetType === 'user' && !U(f.targetId)) throw new Error('Выберите сотрудника');
      if (f.targetType === 'user' && f.targetId === u.id) throw new Error('Нельзя поблагодарить самого себя');
      if (f.targetType === 'org' && !O(f.targetId)) throw new Error('Выберите совет');
      Object.assign(x, { userId: u.id, targetType: f.targetType, targetId: f.targetType === 'platform' ? null : f.targetId, isPublic: f.isPublic !== false, status: 'published' });
      if (x.targetType === 'user') notify(x.targetId, `${u.name} благодарит вас: «${body.slice(0, 140)}»`, '#person-' + x.targetId);
      else if (x.targetType === 'org') { const ch = O(x.targetId).council.chairId; if (ch && ch !== u.id) notify(ch, `${u.name} благодарит Молодёжный совет: «${body.slice(0, 120)}»`, '#company-' + x.targetId); }
      else DB.users.filter((a) => a.role === 'admin').forEach((a) => notify(a.id, 'Новая благодарность команде платформы', '#feedback'));
      audit('Благодарность', 'feedback', x.id, FB_KINDS.thanks.name);
    } else {
      if (f.anonymous) x.userId = null;
      else if (!u) {
        const name = String((f.contact || {}).name || '').trim(); const email = String((f.contact || {}).email || '').trim();
        if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Укажите имя и e-mail для ответа');
        x.contact = { name, email };

/* ---------- данные: демо и общая база ---------- */
const GROUPAPI = {
  async saveProfile(o, p) {
    if (LIVE) {
      const row = await rpc('update_org_assets', { o: o.id, p });
      const i = DB.orgs.findIndex((x) => x.id === o.id); DB.orgs[i] = ROW.org(row); commit(); return;
    }
    o.profile = p;
    audit('Изменение профиля организации', 'org', o.id, o.name);
    commit();
  },
  async saveVacancy(v) {
    if (LIVE) {
      const row = await rpc('save_vacancy', { v });
      const obj = ROW.vacancy(row); const i = vacList().findIndex((x) => x.id === obj.id);
      if (i >= 0) DB.vacancies[i] = obj; else DB.vacancies.push(obj);
      commit(); return obj;
    }
    if (!O(v.orgId)) throw new Error('Выберите организацию');
    if (!canManageVac(v.orgId)) throw new Error('Вакансии организации добавляет председатель её совета или администратор');
    const old = v.id ? vacList().find((x) => x.id === v.id) : null;
    if (old && !canManageVac(old.orgId)) throw new Error('Нет прав на изменение этой вакансии');
    let obj;
    if (old) obj = Object.assign(old, { ...v, id: old.id });
    else { obj = { ...v, id: uid('vac'), createdBy: me().id, createdAt: new Date().toISOString(), demo: false }; vacList().push(obj); }
    audit(old ? 'Изменение вакансии' : 'Добавление вакансии', 'vacancy', obj.id, obj.title + ' · ' + orgLabel(obj.orgId));
    commit(); return obj;
  },
  async removeVacancy(id) {
    if (LIVE) { await rpc('delete_vacancy', { vid: id }); DB.vacancies = vacList().filter((x) => x.id !== id); commit(); return; }
    const v = vacList().find((x) => x.id === id);
    if (!v || !canManageVac(v.orgId)) throw new Error('Нет прав на удаление этой вакансии');
    DB.vacancies = vacList().filter((x) => x.id !== id);
    audit('Удаление вакансии', 'vacancy', id, v.title);
    commit();
  },
  async savePeople(list) {
    if (LIVE) await tbl(sb.from('settings').update({ people: list, updated_at: new Date().toISOString() }).eq('id', 1));
    DB.settings.people = list;
    audit('Изменение ключевых контактов', 'settings', 'people', list.map((p) => p.role).join(', '));
    commit();
  }
};

function capacityBars(orgs) {
  const rows = orgs.filter((o) => prof(o).mw > 0 && kindOf(o) !== 'project').sort((a, b) => prof(b).mw - prof(a).mw);
  if (!rows.length) return '<p class="muted">Мощности пока не указаны</p>';
  const max = prof(rows[0]).mw;
  const byKind = {};
  rows.forEach((o) => { const k = KIND_TONE[kindOf(o)] ? kindOf(o) : 'thermal'; byKind[k] = (byKind[k] || 0) + prof(o).mw; });
  const legend = Object.keys(KIND_TONE).filter((k) => byKind[k]).map((k) => `<span><i class="sw ${KIND_TONE[k]}"></i>${esc(ORG_KINDS[k].name)} — <b>${nfCap.format(byKind[k])} МВт</b></span>`).join('');
  return `<div class="cb-leg">${legend}</div>
    <div class="capbars" role="list" aria-label="Установленная электрическая мощность по организациям, МВт">${rows.map((o) => {

function ocNode(o, cls = '') {
  const p = prof(o); const k = ORG_KINDS[kindOf(o)] || ORG_KINDS.service;
  const kids = childrenOf(o.id);
  return `<div class="oc-item"><a class="oc-node ${cls} ${o.type}" href="#company-${o.id}">${orgLogo(o, 30)}<span><b>${esc(o.name)}</b><small>${esc(o.type === 'subsidiary' ? 'Филиал' : capLabel(p) || k.name)}</small></span></a>${kids.length ? `<div class="oc-kids">${kids.map((x) => ocNode(x)).join('')}</div>` : ''}</div>`;
}
function orgChart() {
  const head = O(headId());
  const dzo = DB.orgs.filter((o) => o.type === 'portfolio');
  const used = new Set();
  const take = (f) => dzo.filter((o) => !used.has(o.id) && f(o)).map((o) => { used.add(o.id); return o; });
  const qgp = dzo.find((o) => kindOf(o) === 'holding');
  const thermal = take((o) => kindOf(o) === 'thermal');
  if (qgp) used.add(qgp.id);
  const inQgp = take((o) => prof(o).holding === 'qgp');
  const greenOther = take((o) => ['hydro', 'res'].includes(kindOf(o)));
  const grid = take((o) => kindOf(o) === 'grid');
  const build = take((o) => kindOf(o) === 'project');
  const other = take(() => true);
  const col = (ic, name, html, n) => `<section class="oc-col"><h3>${icon(ic, 16)}<span>${esc(name)}</span><small>${n}</small></h3><div class="oc-list">${html}</div></section>`;
  const green = `${qgp ? `<div class="oc-hold">${ocNode(qgp, 'hold')}<div class="oc-hold-l">${inQgp.map((o) => ocNode(o)).join('')}</div></div>` : inQgp.map((o) => ocNode(o)).join('')}${greenOther.map((o) => ocNode(o)).join('')}`;
  const cols = [
    col('flame', 'Тепловая генерация', thermal.map((o) => ocNode(o)).join(''), thermal.length),
    col('drop', 'Гидроэнергетика и ВИЭ', green, inQgp.length + greenOther.length + (qgp ? 1 : 0)),
    col('bolt', 'Сети и энергосбыт', grid.map((o) => ocNode(o)).join(''), grid.length),
    col('crane', 'Строительство новых ТЭЦ', build.map((o) => ocNode(o)).join(''), build.length)
  ];
  if (other.length) cols.push(col('building', 'Другие организации', other.map((o) => ocNode(o)).join(''), other.length));
  return `<div class="orgchart"><div class="oc-root">${head ? ocNode(head, 'root') : ''}</div><div class="oc-cols n${cols.length}">${cols.join('')}</div></div>`;
}
