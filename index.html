<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JASTAR HUB</title>
<meta name="description" content="Единая цифровая платформа Молодёжного совета группы компаний АО «Самрук-Энерго»">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
/* Layout: тёмно-синяя навигационная колонна слева, светлая рабочая поверхность справа; на телефоне колонна уходит в выдвижное меню */
:root {
  --bg: #f2f5f9;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --surface-3: #edf1f6;
  --line: #e0e6ee;
  --line-2: #cbd5e1;
  --ink: #0c1a2c;
  --ink-2: #44546b;
  --ink-3: #6f7f96;
  --navy: #0b1d38;
  --navy-2: #12294a;
  --navy-3: #1a3660;
  --on-navy: #e7edf6;
  --on-navy-2: #95a8c4;
  --accent: #0a93a1;
  --accent-ink: #06717c;
  --accent-soft: #def3f4;
  --good: #1b8a51; --good-soft: #e1f3e8;
  --warn: #a96d00; --warn-soft: #fbefd6;
  --bad: #c43a3a; --bad-soft: #fbe5e3;
  --info: #2c5cc9; --info-soft: #e5ecfb;
  --test: #7a5c00; --test-soft: #fff4cf;
  --s1: #00939f; --s2: #e8622c; --s3: #3157d4; --s4: #d79a00;
  --grid: #e9eef4; --axis: #c6d0dc;
  --shadow: 0 1px 2px rgba(12, 26, 44, .05), 0 6px 20px rgba(12, 26, 44, .05);
  --f-display: "Unbounded", "Onest", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px; --r-sm: 7px;
  --side-w: 252px;
  --top-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08111f; --surface: #0f1b2e; --surface-2: #132238; --surface-3: #182a43; --line: #1f3048; --line-2: #2b405e;
    --ink: #e6edf7; --ink-2: #a6b5ca; --ink-3: #7b8ca5;
    --navy: #060e1c; --navy-2: #0c1830; --navy-3: #142644; --on-navy: #e6edf7; --on-navy-2: #8a9dba;
    --accent: #19b2c0; --accent-ink: #55d0db; --accent-soft: #0e3440;
    --good: #43c07f; --good-soft: #10301f; --warn: #e2a63a; --warn-soft: #33270c; --bad: #ef6d63; --bad-soft: #3a1919; --info: #7c9df0; --info-soft: #172649;
    --test: #f1cf6b; --test-soft: #352b0a;
    --s1: #0aa3b0; --s2: #d9592a; --s3: #5b82ea; --s4: #b98000;
    --grid: #1a2a40; --axis: #2e425e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08111f; --surface: #0f1b2e; --surface-2: #132238; --surface-3: #182a43; --line: #1f3048; --line-2: #2b405e;
  --ink: #e6edf7; --ink-2: #a6b5ca; --ink-3: #7b8ca5;
  --navy: #060e1c; --navy-2: #0c1830; --navy-3: #142644; --on-navy: #e6edf7; --on-navy-2: #8a9dba;
  --accent: #19b2c0; --accent-ink: #55d0db; --accent-soft: #0e3440;
  --good: #43c07f; --good-soft: #10301f; --warn: #e2a63a; --warn-soft: #33270c; --bad: #ef6d63; --bad-soft: #3a1919; --info: #7c9df0; --info-soft: #172649;
  --test: #f1cf6b; --test-soft: #352b0a;
  --s1: #0aa3b0; --s2: #d9592a; --s3: #5b82ea; --s4: #b98000;
  --grid: #1a2a40; --axis: #2e425e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14.5px/1.5 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.ic { flex: none; display: block; }
.muted { color: var(--ink-3); }
.sm { font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.nowrap { white-space: nowrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.pad { padding: 14px; }

/* ---------- оболочка ---------- */
.demo-strip { background: var(--test-soft); color: var(--test); font-size: 12.5px; text-align: center; padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.demo-strip b { font-weight: 600; }
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--navy); color: var(--on-navy); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding: 18px 12px 16px; padding-left: max(12px, env(safe-area-inset-left, 0px)); z-index: 40; }
.brand { display: flex; gap: 11px; align-items: center; padding: 4px 8px 18px; }
.brand b { font: 600 15px/1.1 var(--f-display); letter-spacing: .04em; display: block; }
.brand small { display: block; color: var(--on-navy-2); font-size: 11px; line-height: 1.3; margin-top: 4px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
.ng { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--on-navy-2); padding: 6px 12px; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 8px 12px; border-radius: 8px; color: var(--on-navy); opacity: .86; font-weight: 500; font-size: 14px; }
.nav-item:hover { background: var(--navy-2); opacity: 1; }
.nav-item.active { background: var(--navy-3); opacity: 1; box-shadow: inset 2px 0 0 var(--accent); }
.nav-item.active .ic { color: var(--accent); }
.nav-item .pill { margin-left: auto; background: var(--accent); color: #fff; font-size: 11px; border-radius: 10px; padding: 0 7px; }
.side-foot { margin-top: auto; padding: 14px 12px 0; border-top: 1px solid var(--navy-3); }
.slogan { font-size: 12px; color: var(--on-navy-2); line-height: 1.45; display: block; }
.col { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top-h); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.gsearch { position: relative; flex: 1 1 auto; max-width: 520px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; color: var(--ink-3); }
.gsearch input { border: 0; background: transparent; height: 38px; width: 100%; color: var(--ink); font: inherit; outline: none; }
.gsearch:focus-within { border-color: var(--accent); }
.gres { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); max-height: 70vh; overflow: auto; z-index: 50; color: var(--ink); }
.gs > span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 10px 12px 4px; }
.gs a { display: flex; gap: 10px; align-items: center; padding: 7px 12px; }
.gs a:hover { background: var(--surface-2); }
.gs a span { min-width: 0; }
.gs small { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: transparent; font-size: 11.5px; font-weight: 600; padding: 6px 8px; cursor: pointer; color: var(--ink-3); }
.lang button.on { background: var(--surface-3); color: var(--ink); }
.icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 8px; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-2); position: relative; flex: none; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.bell b { position: absolute; top: 3px; right: 2px; background: var(--bad); color: #fff; font-size: 10px; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
.me-chip { display: flex; align-items: center; gap: 8px; padding: 3px 8px 3px 3px; border-radius: 20px; }
.me-chip:hover { background: var(--surface-3); }
.only-m, .brand-m { display: none; }
.brand-m { align-items: center; gap: 8px; font: 600 13px var(--f-display); letter-spacing: .04em; }
.scrim { display: none; }
.main { flex: 1; }

/* ---------- страницы ---------- */
.page { max-width: 1320px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 900px) { .page { padding-left: 28px; padding-right: 28px; } }
.page.narrow { max-width: 820px; }
.page.narrow-w { max-width: 1040px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font: 600 clamp(22px, 2.6vw, 30px)/1.2 var(--f-display); letter-spacing: -.01em; }
.page-head .sub { color: var(--ink-2); margin-top: 6px; max-width: 72ch; }
.eyebrow { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-ink); font-weight: 600; margin-bottom: 6px; }
.crumbs { font-size: 13px; color: var(--ink-3); }
.crumbs a:hover { color: var(--accent-ink); }
.crumbs span { color: var(--ink-2); }
.count { color: var(--ink-3); font-size: 13px; margin-top: -6px; }
.note { color: var(--ink-3); font-size: 12.5px; margin-top: 10px; line-height: 1.5; }
.note .ic { display: inline; vertical-align: -2px; }
.lead { font-size: 15.5px; color: var(--ink-2); }
.h3 { font: 600 16px/1.3 var(--f-body); }
.lnk { color: var(--accent-ink); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; cursor: pointer; padding: 0; }
.lnk:hover { text-decoration: underline; }
.warn-t { display: block; color: var(--warn); font-size: 12px; margin-top: 3px; }

/* ---------- карточки и сетки ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card.pad { padding: 20px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; flex-wrap: wrap; }
.card-h h2 { font: 600 15px/1.3 var(--f-body); }
.card-b { padding: 14px 16px 16px; min-width: 0; }
.card-h + .card-b { padding-top: 12px; }
.card > .card-b:only-child { padding: 6px 16px; }
.grid { display: grid; gap: 18px; min-width: 0; }
.grid > * { min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.stack-v { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sticky { position: sticky; top: calc(var(--top-h) + 16px + env(safe-area-inset-top, 0px)); align-self: start; }

/* ---------- KPI ---------- */
.kpis { display: grid; gap: 12px; }
.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.k6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "l i" "v v" "n n"; align-content: start; gap: 2px; min-width: 0; }
.kpi-l { grid-area: l; font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
.kpi-i { grid-area: i; color: var(--accent); }
.kpi-v { grid-area: v; font: 600 24px/1.25 var(--f-body); font-variant-numeric: tabular-nums; letter-spacing: -.01em; margin-top: 4px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.kpi-v small { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.kpi-n { grid-area: n; font-size: 12px; color: var(--ink-3); }

/* ---------- кнопки и поля ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { height: 32px; padding: 0 11px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-row.end { justify-content: flex-end; }
.btn-row.center { justify-content: center; }
.role-btn span { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.input { width: 100%; min-width: 0; height: 40px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); padding: 0 11px; font: inherit; }
textarea.input { height: auto; padding: 9px 11px; resize: vertical; line-height: 1.5; }
select.input { padding-right: 28px; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.num { text-align: right; font-variant-numeric: tabular-nums; }
.input.sm { height: 32px; width: 96px; }
.input:disabled { background: var(--surface-2); color: var(--ink-3); }
.form { display: flex; flex-direction: column; gap: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fl { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.fl em, .fs em { color: var(--bad); font-style: normal; }
.fh { font-size: 12px; color: var(--ink-3); }
.fs { font: 600 15px/1.3 var(--f-body); margin-bottom: 4px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); }
.inline .input { width: auto; height: 34px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters > select.input { width: auto; max-width: 260px; height: 38px; }
.f-search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); padding: 0 10px; color: var(--ink-3); min-width: 0; }
.f-search input { border: 0; background: transparent; height: 36px; width: 100%; color: var(--ink); font: inherit; outline: none; min-width: 0; }
.f-search:focus-within { border-color: var(--accent); }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(12, 26, 44, .12); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 10px 12px; font-weight: 500; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.cnt { background: var(--surface-3); color: var(--ink-2); font-size: 11.5px; border-radius: 9px; padding: 0 7px; font-variant-numeric: tabular-nums; }
.more { display: flex; justify-content: center; padding: 6px; }

/* ---------- чипы, статусы ---------- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; background: var(--surface-3); color: var(--ink-2); font-size: 12px; font-weight: 500; white-space: nowrap; border: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
a.chip:hover { background: var(--line); }
button.chip { cursor: pointer; }
.chip.on { background: var(--navy); color: #fff; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.cat { background: color-mix(in srgb, var(--c) 13%, var(--surface)); color: color-mix(in srgb, var(--c) 78%, var(--ink)); }
.tone-good { background: var(--good-soft); color: var(--good); }
.tone-warn { background: var(--warn-soft); color: var(--warn); }
.tone-bad { background: var(--bad-soft); color: var(--bad); }
.tone-info { background: var(--info-soft); color: var(--info); }
.tone-accent { background: var(--accent-soft); color: var(--accent-ink); }
.tone-muted { background: var(--surface-3); color: var(--ink-3); }
.tone-test { background: var(--test-soft); color: var(--test); letter-spacing: .06em; font-size: 10.5px; font-weight: 700; height: 20px; }
.chip-x { border: 0; background: transparent; padding: 0; margin-left: 2px; cursor: pointer; color: inherit; display: inline-grid; }
.filter-chips .chip { height: 30px; padding: 0 13px; font-size: 13px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: 0; }
.sw.s1 { background: var(--s1); } .sw.s2 { background: var(--s2); } .sw.s3 { background: var(--s3); } .sw.s4 { background: var(--s4); }

/* ---------- аватары и логотипы ---------- */
.av { --s: 36px; width: var(--s); height: var(--s); border-radius: 50%; flex: none; position: relative; display: inline-grid; place-items: center; overflow: hidden; background: hsl(var(--h, 210) 38% 88%); color: hsl(var(--h, 210) 42% 28%); font-weight: 600; font-size: calc(var(--s) * .36); letter-spacing: .02em; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.av img:not([src]) { display: none; }
:root[data-theme="dark"] .av { background: hsl(var(--h, 210) 30% 24%); color: hsl(var(--h, 210) 50% 84%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .av { background: hsl(var(--h, 210) 30% 24%); color: hsl(var(--h, 210) 50% 84%); } }
.logo { --s: 40px; width: var(--s); height: var(--s); border-radius: calc(var(--s) * .22); flex: none; display: inline-grid; place-items: center; background: hsl(var(--h) 52% 34%); color: #fff; font: 600 calc(var(--s) * .27)/1 var(--f-display); letter-spacing: .02em; text-align: center; padding: 2px; overflow: hidden; }
.logo.sub { background: hsl(var(--h) 45% 92%); color: hsl(var(--h) 52% 30%); box-shadow: inset 0 0 0 1px hsl(var(--h) 40% 78%); }
:root[data-theme="dark"] .logo.sub { background: hsl(var(--h) 30% 20%); color: hsl(var(--h) 60% 80%); box-shadow: inset 0 0 0 1px hsl(var(--h) 30% 34%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo.sub { background: hsl(var(--h) 30% 20%); color: hsl(var(--h) 60% 80%); box-shadow: inset 0 0 0 1px hsl(var(--h) 30% 34%); } }
.stack { display: inline-flex; }
.stack .av { box-shadow: 0 0 0 2px var(--surface); }
.stack .av + .av { margin-left: -8px; }

/* ---------- главная ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; background: var(--navy); color: var(--on-navy); border-radius: 14px; padding: 28px; position: relative; overflow: hidden; }
.hero > * { position: relative; z-index: 1; }
.hero::after { z-index: 0; content: ""; position: absolute; right: -60px; top: -80px; width: 340px; height: 340px; border-radius: 50%; border: 1px solid var(--navy-3); box-shadow: 0 0 0 46px rgba(255, 255, 255, .015), 0 0 0 92px rgba(255, 255, 255, .012); pointer-events: none; }
.hero .eyebrow { color: #6fd6df; }
.wordmark { font: 700 clamp(34px, 5vw, 58px)/1 var(--f-display); letter-spacing: .02em; margin-top: 8px; }
.slogan-l { font-size: 17px; color: #bfe9ed; margin-top: 12px; font-weight: 500; }
.hero .lead { color: var(--on-navy-2); margin-top: 12px; max-width: 62ch; font-size: 14.5px; }
.hero-links { display: flex; gap: 18px; margin-top: 18px; flex-wrap: wrap; }
.hero-links a { display: inline-flex; align-items: center; gap: 6px; color: var(--on-navy); font-weight: 500; font-size: 14px; border-bottom: 1px solid var(--navy-3); padding-bottom: 2px; }
.hero-links a:hover { border-color: var(--accent); }
.hero-side { background: var(--navy-2); border: 1px solid var(--navy-3); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
.hero-side .muted { color: var(--on-navy-2); }
.hero-side .btn:not(.primary) { background: transparent; color: var(--on-navy); border-color: var(--navy-3); }
.hero-side .btn:not(.primary):hover { background: var(--navy-3); }
.hs-t { font-weight: 600; }
.hs-u { display: flex; align-items: center; gap: 12px; }
.hs-u small { display: block; color: var(--on-navy-2); font-size: 12px; }
.hs-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hs-stats span { background: var(--navy); border-radius: 8px; padding: 8px 10px; }
.hs-stats small { display: block; font-size: 11.5px; color: var(--on-navy-2); }
.hs-stats b { font-size: 20px; font-variant-numeric: tabular-nums; }
.steps { margin: 0; padding-left: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; color: var(--on-navy-2); }
.steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; }
.steps li::before { content: counter(s); flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--accent); color: #6fd6df; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.steps b { color: var(--on-navy); font-weight: 600; }
.toplist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.toplist li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.toplist li:last-child { border-bottom: 0; }
.rk { width: 24px; flex: none; text-align: center; font: 600 14px var(--f-display); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.toplist li:first-child .rk { color: var(--accent-ink); }
.tl-m { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.tl-m span { min-width: 0; }
.tl-m b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-m small { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-m:hover b { color: var(--accent-ink); }
.tl-v { font-variant-numeric: tabular-nums; font-size: 15px; }
.map-note { font-size: 12px; color: var(--ink-3); margin: 6px 0 14px; display: flex; gap: 6px; }
.map-note span { display: flex; gap: 6px; align-items: flex-start; }
.nlist { display: flex; flex-direction: column; }
.nl { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.nl:last-child { border-bottom: 0; }
.nl small { color: var(--ink-3); font-size: 12px; }
.nl b { font-weight: 500; font-size: 13.5px; line-height: 1.4; }
.nl:hover b { color: var(--accent-ink); }

/* ---------- графики ---------- */
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.chart .grid, .chart line.grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { stroke: none; opacity: .1; }
.chart .pt { stroke: var(--surface); stroke-width: 2; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit:hover { fill: var(--ink); fill-opacity: .04; }
.ln.s1 { stroke: var(--s1); } .ln.s2 { stroke: var(--s2); } .ln.s3 { stroke: var(--s3); } .ln.s4 { stroke: var(--s4); }
.area.s1, .pt.s1, .bf.s1 { fill: var(--s1); } .area.s2, .pt.s2, .bf.s2 { fill: var(--s2); } .area.s3, .pt.s3, .bf.s3 { fill: var(--s3); } .bf.s4, .pt.s4 { fill: var(--s4); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend .s1 { background: var(--s1); } .legend .s2 { background: var(--s2); } .legend .s3 { background: var(--s3); } .legend .s4 { background: var(--s4); }
.chart .kz { fill: var(--surface-2); stroke: var(--line-2); stroke-width: 1.2; stroke-linejoin: round; }
.chart .bub { fill: var(--accent); fill-opacity: .72; stroke: var(--surface); stroke-width: 2; transition: fill-opacity .15s; }
.chart .bub.zero { fill: var(--ink-3); fill-opacity: .35; }
.chart .reg { cursor: pointer; }
.chart .reg:hover .bub { fill-opacity: 1; }
.chart .maplbl { fill: var(--ink-2); font-size: 11.5px; font-weight: 500; font-family: var(--f-body); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.hbars { display: flex; flex-direction: column; gap: 7px; }
.hb { display: grid; grid-template-columns: minmax(90px, 38%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.hb-l { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-t { height: 10px; background: var(--surface-3); border-radius: 0 3px 3px 0; overflow: hidden; }
.hb-t i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
.hb-v { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 36px; text-align: right; }
.bar { display: inline-block; width: 100%; height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.good i { background: var(--good); } .bar.warn i { background: var(--warn); }
.spark { display: block; }
.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.same { color: var(--ink-3); } .delta.new { color: var(--ink-3); font-weight: 500; font-size: 11px; }
.breakdown { display: flex; flex-direction: column; gap: 10px; }
.breakdown.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 22px; padding: 6px 0; }
.bd { display: grid; grid-template-columns: minmax(0, 1fr) 90px 72px; gap: 10px; align-items: center; font-size: 13px; }
.bd-l { color: var(--ink-2); min-width: 0; }
.bd-l small { color: var(--ink-3); }
.bd-v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.bd-v small { color: var(--ink-3); font-weight: 500; }
.rankstrip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 10px; }
.rankstrip span { text-align: center; background: var(--surface-2); border-radius: 6px; padding: 5px 0; }
.rankstrip small { display: block; font-size: 11px; color: var(--ink-3); }
.rankstrip b { font-variant-numeric: tabular-nums; }

/* ---------- таблицы ---------- */
.tbl-wrap { overflow-x: auto; margin: 0 -2px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 500; font-size: 12px; color: var(--ink-3); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td small { display: block; color: var(--ink-3); font-size: 12px; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.act { white-space: nowrap; text-align: right; }
.tbl td.act .btn + .btn { margin-left: 6px; }
.tbl select.input { height: 32px; min-width: 150px; }
.tcell { display: flex; align-items: center; gap: 10px; min-width: 190px; }
.tcell b { font-weight: 600; }
.tcell:hover b { color: var(--accent-ink); }
.tbl.rating tr.top td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.tbl.rating .rk { font-size: 15px; }
.tbl.rating tr.top .rk { color: var(--accent-ink); }
.tbl tr.detail td { background: var(--surface-2); }
.tbl tr.open td { border-bottom-color: transparent; }
.sc { display: inline-flex; align-items: center; gap: 8px; min-width: 120px; }
.sc .bar { width: 60px; }
.tbl.perm td:not(:first-child), .tbl.perm th:not(:first-child) { text-align: center; }
.tbl.perm td .ic { margin: 0 auto; color: var(--good); }
.bicons { display: inline-flex; gap: 4px; color: var(--accent-ink); }
.tbl.audit td { font-size: 13px; }

/* ---------- компании и люди ---------- */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ccard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: border-color .15s, box-shadow .15s; }
.ccard:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.ccard.head { grid-column: 1 / -1; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ccard.branch { background: var(--surface-2); }
.cc-h { display: flex; gap: 12px; align-items: center; }
.cc-h span { min-width: 0; }
.cc-h b { display: block; font-size: 15px; }
.cc-h small { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-m { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0; border-top: 1px solid var(--line); padding-top: 12px; }
.cc-m dt { font-size: 11px; color: var(--ink-3); }
.cc-m dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.cc-f { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.ugrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.ucard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; gap: 12px; align-items: center; }

.uc-m { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.uc-m b { font-size: 14px; }
.uc-m small { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uc-s { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
.uc-s b { font-variant-numeric: tabular-nums; font-size: 16px; }
.uc-s small { display: block; font-size: 11px; color: var(--ink-3); }
.ent-h { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.ent-h h1 { font: 600 clamp(22px, 2.4vw, 28px)/1.2 var(--f-display); }
.ent-h .sub { color: var(--ink-2); margin: 4px 0 10px; }
.ent-h .sub a { color: var(--accent-ink); }
.ent-h .btn-row { align-self: center; }
.person-l { display: flex; gap: 14px; align-items: center; }
.person-l b { display: block; font-size: 15px; }
.person-l small, .person-s small { display: block; color: var(--ink-3); font-size: 12.5px; }
.person-s { display: flex; gap: 10px; align-items: center; padding: 7px 0; }
.person-s + .person-s { border-top: 1px solid var(--line); }
.person-l:hover b, .person-s:hover b { color: var(--accent-ink); }
.dl2, .dl1 { display: grid; gap: 12px 20px; margin: 14px 0 0; }
.dl2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dl2 dt, .dl1 dt { font-size: 12px; color: var(--ink-3); }
.dl2 dd, .dl1 dd { margin: 2px 0 0; }
.dl1 dd { line-height: 1.55; }
.dl2 + .chips, .dl1 + .chips { margin-top: 14px; }
.stats2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 0 0 12px; }
.stats2 div { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.stats2 dt { font-size: 12px; color: var(--ink-3); }
.stats2 dd { margin: 2px 0 0; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badges.sm { margin-top: 10px; }
.badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid var(--line-2); border-radius: 18px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); background: var(--surface); }
.badge .ic { color: var(--accent-ink); }
.badges.sm .badge { padding: 3px 9px; font-size: 12px; }
.list { display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow small { display: block; color: var(--ink-3); font-size: 12px; }
.lrow > .ic { color: var(--ink-3); }
a.lrow:hover b { color: var(--accent-ink); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 8px 0 8px; border-left: 2px solid var(--line); padding-left: 14px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: -5px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tl-d { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.timeline small { display: block; color: var(--ink-3); font-size: 12px; }
.timeline a { color: var(--accent-ink); }
.photo-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.hint-card { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); color: var(--accent-ink); border-radius: 8px; padding: 12px; font-size: 13.5px; }
.upl-row { display: flex; gap: 10px; flex-wrap: wrap; }
.upl-row select { max-width: 260px; }

/* ---------- проекты ---------- */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, box-shadow .15s; min-width: 0; }
.pcard:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.cover { height: 108px; position: relative; background: color-mix(in srgb, var(--c) 12%, var(--surface)); background-image: radial-gradient(color-mix(in srgb, var(--c) 22%, transparent) 1.2px, transparent 1.4px); background-size: 14px 14px; display: grid; place-items: center; color: color-mix(in srgb, var(--c) 80%, var(--ink)); overflow: hidden; }

.pc-b { padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }

.pc-b .meta { color: var(--ink-3); font-size: 12.5px; }

.pc-f { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 12px; font-size: 12.5px; }
.pc-f .stack { margin-right: auto; }

.proj-h { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.proj-h h1 { font: 600 clamp(22px, 2.4vw, 28px)/1.25 var(--f-display); margin: 8px 0 6px; }
.proj-h .sub { color: var(--ink-2); }
.proj-h .sub a { color: var(--accent-ink); }
.proj-h .btn-row { align-self: center; }
.proj-cover { width: 96px; height: 96px; border-radius: 12px; flex: none; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: color-mix(in srgb, var(--c) 80%, var(--ink)); display: grid; place-items: center; overflow: hidden; position: relative; }
.proj-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.proj-cover img:not([src]) { display: none; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); font-size: 13.5px; }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.info { background: var(--info-soft); color: var(--info); }
.banner .lnk { color: inherit; text-decoration: underline; }
.kpi-bar { display: inline-flex; align-items: center; gap: 8px; min-width: 150px; }
.kpi-bar .bar { width: 90px; }
.kpi-bar b { font-variant-numeric: tabular-nums; font-size: 13px; }
.team { display: flex; flex-direction: column; }
.tm { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.tm:last-child { border-bottom: 0; }
.tm small { display: block; color: var(--ink-3); font-size: 12px; }
a.tm:hover b { color: var(--accent-ink); }
.share { font-weight: 600; font-variant-numeric: tabular-nums; background: var(--surface-3); border-radius: 10px; padding: 1px 8px; font-size: 12.5px; }
.bigscore { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.bigscore b { font: 600 34px/1 var(--f-display); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.bigscore span { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.bigscore small { color: var(--ink-3); }
blockquote { margin: 12px 0 0; border-left: 3px solid var(--line-2); padding: 4px 0 4px 12px; color: var(--ink-2); font-size: 13.5px; }
.comments { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
.cm { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; margin-top: 10px; }
.cm p { margin-top: 2px; color: var(--ink-2); }
.cm-form { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; }
.ph { margin: 0; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 8px; background: color-mix(in srgb, var(--c) 10%, var(--surface-2)); color: color-mix(in srgb, var(--c) 70%, var(--ink-3)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11.5px; position: relative; overflow: hidden; text-align: center; padding: 6px; }
.ph[data-act] { cursor: zoom-in; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph img:not([src]) { display: none; }
.ph-rm { position: absolute; top: 4px; right: 4px; z-index: 2; border: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }
.filerow .ph-rm { position: static; box-shadow: none; background: var(--surface-3); }
.files { display: flex; flex-direction: column; gap: 6px; }
.filerow { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
.filerow[data-act] { cursor: pointer; }
.filerow[data-act]:hover { border-color: var(--accent); }
.fn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.drop { display: flex; align-items: center; gap: 12px; border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 16px; cursor: pointer; color: var(--ink-3); background: var(--surface-2); }
.drop b { display: block; color: var(--ink); font-weight: 500; font-size: 14px; }
.drop small { font-size: 12px; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--accent-ink); }
.team-ed { display: flex; flex-direction: column; gap: 8px; }
.te-row { display: grid; grid-template-columns: auto minmax(120px, 1.2fr) minmax(110px, 1fr) 96px auto; gap: 10px; align-items: center; }
.te-n { min-width: 0; }
.te-n b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.te-n small { color: var(--ink-3); font-size: 12px; }
.te-s { display: flex; align-items: center; gap: 4px; color: var(--ink-3); }
.te-foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0 6px; }
.sugg-wrap { position: relative; flex: 1 1 280px; }
.sugg { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); max-height: 300px; overflow: auto; }
.sugg button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; cursor: pointer; }
.sugg button:hover { background: var(--surface-2); }
.sugg small { display: block; color: var(--ink-3); font-size: 12px; }
.share-sum { font-size: 13px; padding: 4px 10px; border-radius: 8px; }
.share-sum.ok { background: var(--good-soft); color: var(--good); }
.share-sum.bad { background: var(--bad-soft); color: var(--bad); }
.kpi-ed { display: flex; flex-direction: column; gap: 8px; }
.ke-row { display: grid; grid-template-columns: minmax(0, 2fr) 80px 100px 100px auto; gap: 8px; align-items: center; }
.sticky-actions { position: sticky; bottom: 0; background: var(--bg); padding-block: 12px; border-top: 1px solid var(--line); z-index: 5; }

/* ---------- мероприятия ---------- */
.elist { display: flex; flex-direction: column; }
.erow { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.card .elist .erow:last-child { border-bottom: 0; }
.erow:hover .emain b { color: var(--accent-ink); }
.edate { width: 46px; flex: none; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; background: var(--surface); }
.edate b { display: block; font: 600 17px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.edate small { font-size: 11px; color: var(--ink-3); }
.edate.big { width: 76px; padding: 10px 0; }
.edate.big b { font-size: 28px; }
.emain { flex: 1; min-width: 0; }
.emain b { display: block; font-weight: 600; font-size: 14px; }
.emain small { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eside { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 46%; }
.eside small { display: inline-flex; gap: 3px; align-items: center; }
.cal-head { display: flex; align-items: center; gap: 8px; }
.cal-head h2 { font: 600 18px var(--f-display); min-width: 190px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: 12px; color: var(--ink-3); text-align: center; padding: 4px 0; }
.cal-c { min-height: 92px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 3px; align-items: stretch; text-align: left; cursor: pointer; min-width: 0; overflow: hidden; }
.cal-c.empty { background: transparent; border-color: transparent; cursor: default; }
.cal-c b { font-size: 12.5px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal-c.today b { color: #fff; background: var(--accent); border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; }
.cal-c.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cal-c:hover:not(.empty) { border-color: var(--line-2); }
.cal-e { font-size: 11px; line-height: 1.3; padding: 2px 5px; border-radius: 4px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: color-mix(in srgb, var(--c) 80%, var(--ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-c small { font-size: 11px; color: var(--ink-3); }
.cal-dots { display: none; gap: 3px; }
.cal-dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.cal-list h3 { font: 600 15px/1.3 var(--f-body); margin: 4px 0 6px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.grp { font: 600 14px var(--f-body); color: var(--ink-2); margin-top: 6px; }
.ent-h.ev .edate.big { border-color: color-mix(in srgb, var(--c) 40%, var(--line)); }
.avs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
.more-n { font-size: 12px; color: var(--ink-3); align-self: center; padding: 0 6px; }

/* ---------- рейтинг ---------- */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: end; }
.pod { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; position: relative; min-width: 0; }
.pod:hover { box-shadow: var(--shadow); }
.pod b { font-size: 15px; line-height: 1.3; }
.pod.p1 { padding-top: 28px; padding-bottom: 24px; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pod-n { position: absolute; top: 10px; left: 12px; font: 700 22px/1 var(--f-display); color: var(--ink-3); }
.pod.p1 .pod-n { color: var(--accent-ink); }
.pod-s { font: 600 22px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.pod-s small { font: 500 12px var(--f-body); color: var(--ink-3); }
.pod-m { font-size: 12px; color: var(--ink-3); }

/* ---------- экспертиза ---------- */
.qlist { display: flex; flex-direction: column; }
.qrow { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.qrow:last-child { border-bottom: 0; }
.qrow:hover { background: var(--surface-2); }
.qrow small { display: block; color: var(--ink-3); font-size: 12px; }
.q-ic { width: 36px; height: 36px; border-radius: 9px; background: var(--surface-3); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.q-ic.big { width: 56px; height: 56px; border-radius: 12px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: color-mix(in srgb, var(--c) 80%, var(--ink)); }
.q-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.crit label { grid-column: 1 / -1; }
.crit label b { display: block; font-size: 13.5px; font-weight: 600; }
.crit label small { color: var(--ink-3); font-size: 12px; }
.crit input[type="range"] { width: 100%; accent-color: var(--accent); }
.crit output { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.avg-line { font-size: 13.5px; color: var(--ink-2); padding: 6px 0; }
.review .sticky .card { max-height: calc(100vh - var(--top-h) - 40px); overflow: auto; }

/* ---------- новости и база знаний ---------- */
.ngrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.ngrid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ncard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
.ncard:hover { box-shadow: var(--shadow); }
.ncard:hover h3 { color: var(--accent-ink); }
.ncard.big { grid-column: span 2; grid-row: span 2; }
.ncover { aspect-ratio: 16 / 7; max-width: 100%; background: hsl(var(--h) 40% 92%); background-image: repeating-linear-gradient(135deg, hsl(var(--h) 40% 86%) 0 1px, transparent 1px 14px); display: grid; place-items: center; color: hsl(var(--h) 45% 32%); font: 600 13px var(--f-display); letter-spacing: .06em; text-transform: uppercase; position: relative; overflow: hidden; }
.ncard.big .ncover { aspect-ratio: 16 / 8; }
.ncover.big { aspect-ratio: 16 / 7; border-radius: var(--r); margin: 18px 0; }
.ncover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ncover img:not([src]) { display: none; }
:root[data-theme="dark"] .ncover { background-color: hsl(var(--h) 30% 16%); background-image: repeating-linear-gradient(135deg, hsl(var(--h) 30% 22%) 0 1px, transparent 1px 14px); color: hsl(var(--h) 50% 78%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ncover { background-color: hsl(var(--h) 30% 16%); background-image: repeating-linear-gradient(135deg, hsl(var(--h) 30% 22%) 0 1px, transparent 1px 14px); color: hsl(var(--h) 50% 78%); } }
.nb { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.nb h3 { font: 600 15px/1.35 var(--f-body); }
.ncard.big .nb h3 { font: 600 20px/1.3 var(--f-display); }
.nb p { color: var(--ink-2); font-size: 14px; }
.nb small { font-size: 12px; }
.article { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(18px, 4vw, 40px); }
.article h1 { font: 600 clamp(24px, 3vw, 34px)/1.2 var(--f-display); margin: 12px 0 10px; }
.article > p { max-width: 68ch; margin-bottom: 14px; font-size: 15.5px; line-height: 1.65; }
.article .lead { font-size: 17px; color: var(--ink-2); }
.byline { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); flex-wrap: wrap; }
.byline a { color: var(--accent-ink); }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.kcard { display: flex; gap: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; cursor: pointer; align-items: flex-start; }
.kcard:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.kcard .grow { display: flex; flex-direction: column; gap: 3px; }
.kcard small { color: var(--accent-ink); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.kcard small.muted { color: var(--ink-3); text-transform: none; letter-spacing: 0; font-weight: 400; }
.kcard b { font-size: 14.5px; }
.kcard span span { color: var(--ink-2); font-size: 13px; }
.k-ic { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.kb-content { white-space: pre-wrap; font: 14px/1.6 var(--f-body); background: var(--surface-2); border-radius: 8px; padding: 16px; margin: 12px 0 0; max-height: 50vh; overflow: auto; }

/* ---------- методика, админка ---------- */
.method { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; line-height: 1.55; }
.example { margin-top: 14px; background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; }
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.flow li { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.w-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.w-sum { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; }
.w-sum.ok { background: var(--good-soft); color: var(--good); }
.w-sum.bad { background: var(--bad-soft); color: var(--bad); }
.cmp-chips .chip { height: 30px; font-size: 13px; }
.cmp-chips .sw { margin-right: 2px; }

/* ---------- вход, регистрация, демо ---------- */
.auth { display: grid; gap: 18px; }
.demo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.demo-acc { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1px solid var(--line); border-radius: var(--r); padding: 12px; background: var(--surface); cursor: pointer; }
.demo-acc:hover { border-color: var(--accent); }
.demo-acc.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.demo-acc > .ic { color: var(--ink-3); margin: 6px; }
.demo-acc b { display: block; font-size: 13.5px; }
.demo-acc small { display: block; font-size: 12px; line-height: 1.4; margin-top: 2px; }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.stepper li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); padding: 6px 12px 6px 6px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.stepper li span { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.stepper li.on { color: var(--ink); border-color: var(--accent); }
.stepper li.on span { background: var(--accent); color: #fff; }
.stepper li.done span { background: var(--good-soft); color: var(--good); }
.nlist2 { display: flex; flex-direction: column; }
.ntf { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ntf:last-child { border-bottom: 0; }
.ntf .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; background: transparent; }
.ntf.unread .dot { background: var(--accent); }
.ntf b { font-weight: 500; display: block; }
.ntf.unread b { font-weight: 600; }
.ntf small { color: var(--ink-3); font-size: 12px; }
.ntf:hover { background: var(--surface-2); }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 40px 20px; color: var(--ink-3); }
.empty b { color: var(--ink); font-size: 16px; }
.empty p { max-width: 48ch; font-size: 13.5px; }
.empty .btn-row, .empty > .btn { margin-top: 8px; }

/* ---------- модальные окна, тосты, подсказки ---------- */
#modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.modal-back { position: absolute; inset: 0; background: rgba(6, 14, 28, .55); }
.modal { position: relative; background: var(--surface); border-radius: 12px; width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal.wide { width: min(880px, 100%); }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px 20px; border-bottom: 1px solid var(--line); }
.modal-h h3 { font: 600 16px/1.3 var(--f-body); }
.modal-b { padding: 16px 20px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-f { padding: 12px 20px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.lightbox { width: 100%; height: auto; border-radius: 8px; }
body.modal-open { overflow: hidden; }
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 120; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--navy); color: #fff; padding: 11px 14px; border-radius: 9px; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); animation: tin .2s ease-out; border-left: 3px solid var(--accent); }
.toast.tone-good { border-left-color: var(--good); background: var(--navy); color: #fff; }
.toast.tone-bad { border-left-color: var(--bad); background: var(--navy); color: #fff; }
.toast.tone-warn { border-left-color: var(--warn); background: var(--navy); color: #fff; }
.toast.out { opacity: 0; transform: translateY(6px); transition: .25s; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
#tip { position: fixed; z-index: 130; pointer-events: none; background: var(--navy); color: #fff; font-size: 12.5px; padding: 7px 10px; border-radius: 7px; white-space: pre-line; max-width: 280px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }

/* ---------- отчёт (светлая печатная версия в любой теме) ---------- */
.report-wrap { overflow-x: auto; }
.report { background: #ffffff; color: #0c1a2c; padding: 28px; border: 1px solid #e0e6ee; border-radius: 8px; font: 13px/1.5 var(--f-body); min-width: 640px; }
.report .rp-h { display: flex; gap: 12px; align-items: center; border-bottom: 2px solid #0b1d38; padding-bottom: 12px; }
.report .rp-h b { font: 600 15px var(--f-display); display: block; color: #0b1d38; }
.report .rp-h span { color: #44546b; font-size: 12.5px; }
.report h2 { font: 600 18px var(--f-display); margin: 16px 0 6px; color: #0b1d38; }
.report h3 { font-size: 14px; margin: 18px 0 6px; color: #0b1d38; }
.report .rp-warn { background: #fff4cf; color: #7a5c00; padding: 8px 10px; border-radius: 6px; font-size: 12px; }
.rp-t { width: 100%; border-collapse: collapse; }
.rp-t th, .rp-t td { border-bottom: 1px solid #e0e6ee; padding: 5px 8px; text-align: left; font-size: 12px; color: #0c1a2c; }
.rp-t th { color: #6f7f96; font-weight: 500; }
.rp-foot { margin-top: 18px; color: #6f7f96; font-size: 11.5px; }
.pdf-stage { position: absolute; left: -10000px; top: 0; width: 794px; }
.pdf-stage .report { min-width: 0; width: 794px; border: 0; border-radius: 0; }

/* ---------- адаптивность ---------- */
@media (max-width: 1240px) { .k6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (max-width: 1100px) {
  .g-2-1, .g3 { grid-template-columns: minmax(0, 1fr); }
  .k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .k5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ngrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .sticky { position: static; }
  .review .sticky .card { max-height: none; }
}
@media (max-width: 1024px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .22s ease; padding-top: max(18px, env(safe-area-inset-top, 0px)); }
  body.drawer-open .side { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .35); }
  body.drawer-open .scrim { display: block; position: fixed; inset: 0; background: rgba(6, 14, 28, .45); z-index: 35; }
  .only-m { display: inline-grid; }
  .brand-m { display: flex; }
  .gsearch { order: 3; }
}
@media (max-width: 760px) {
  .topbar { height: auto; flex-wrap: wrap; padding-block: 8px; row-gap: 8px; }
  .gsearch { flex-basis: 100%; max-width: none; }
  .hide-s, .lang { display: none; }
  .g2, .form-grid, .dl2, .checks, .demo-grid { grid-template-columns: minmax(0, 1fr); }
  .k6, .k5, .k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-v { font-size: 20px; }
  .ngrid, .ngrid.three { grid-template-columns: minmax(0, 1fr); }
  .ncard.big { grid-column: auto; grid-row: auto; }
  .podium { grid-template-columns: minmax(0, 1fr); }
  .pod.p1 { order: -1; }
  .hero { padding: 20px; }
  .te-row { grid-template-columns: auto minmax(0, 1fr) 90px auto; }
  .te-row > .input:not(.num) { grid-column: 2 / -1; grid-row: 2; }
  .ke-row { grid-template-columns: minmax(0, 1fr) 70px; }
  .ke-row .input:first-child { grid-column: 1 / -1; }
  .ke-row .icon-btn { justify-self: end; }
  .cal-c { min-height: 54px; padding: 4px; align-items: center; }
  .cal-e, .cal-c small { display: none; }
  .cal-dots { display: flex; }
  .cal-head h2 { min-width: 0; font-size: 16px; flex: 1; }
  .erow { flex-wrap: wrap; }
  .eside { max-width: none; justify-content: flex-start; padding-left: 58px; }
  .flow li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .timeline li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .bd { grid-template-columns: minmax(0, 1fr) 70px 56px; }
  .hb { grid-template-columns: minmax(80px, 42%) minmax(0, 1fr) auto; }
  .ent-h .btn-row, .proj-h .btn-row { width: 100%; }
  .page-head .btn-row { width: 100%; }
  .filters > select.input { max-width: none; flex: 1 1 160px; }
  .role-btn span { display: none; }
  .role-btn { padding: 0 9px; }
  .top-r { gap: 4px; }
  .sticky-actions { position: static; border-top: 0; padding-block: 0; }
}
.live .role-btn, .live [data-act="role-switch"] { display: none !important; }
body.busy { cursor: progress; }
body.busy .btn.primary, body.busy .modal-f .btn { opacity: .6; pointer-events: none; }
.auth-one { max-width: 520px; margin: 0 auto; width: 100%; }

/* ---------- Детерминированный генератор ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- Генерация ---------- */
function seedDB() {
  const R = mulberry32(20261103);
  const pick = (a) => a[Math.floor(R() * a.length)];
  const rint = (a, b) => Math.floor(a + R() * (b - a + 1));
  const chance = (p) => R() < p;
  const shuffle = (a) => { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; };
  const anchor = new Date(); anchor.setHours(12, 0, 0, 0);
  const dayISO = (offset) => { const d = new Date(anchor); d.setDate(d.getDate() + offset); return d.toISOString().slice(0, 10); };
  const tsISO = (offset, h = 10) => { const d = new Date(anchor); d.setDate(d.getDate() + offset); d.setHours(h, rint(0, 59)); return d.toISOString(); };

  const regions = REGIONS_SEED.map((r) => ({ ...r }));
  const orgs = ORGS_SEED.map((o) => ({
    ...o,
    about: `Молодёжный совет ${o.full} объединяет сотрудников до 35 лет и реализует проекты в области профессионального развития, социальной ответственности и корпоративной культуры. Описание и показатели — тестовые.`,
    profile: JSON.parse(JSON.stringify(ORG_PROFILE[o.id] || {})),
    council: { chairId: null, founded: 2014 + rint(0, 9), regionalReps: [] },
    demo: true
  }));
  /* Склонность к активности: небольшие советы специально сделаны очень активными, чтобы показать нормирование */
  const activity = { se: 1.2, qgp: 1.4, pves: 1.3, ewp: 1.2, sge: 1.25, shges: 1.0, mges: 1.3, ukges: 1.05, bges: 0.95, shulges: 1.1, azhk: 0.9, azhkes: 0.75, ales: 1.05, egres: 1.1, egres2: 0.9, esc: 1.15, escoco: 0.85, semey: 0.8, oskemen: 0.85, ktec: 1.0 };
  const quality = {}; orgs.forEach((o) => { quality[o.id] = 6.2 + R() * 2.6; });

  /* --- пользователи --- */
  const users = [];
  let uidN = 1;
  const usedNames = new Set();
  const makeName = () => {
    for (let i = 0; i < 50; i++) {
      const g = chance(0.5) ? 'm' : 'f';
      const s = pick(SURNAMES)[g === 'm' ? 0 : 1];
      const n = pick(NAMES[g]);
      const full = `${s} ${n}`;
      if (!usedNames.has(full)) { usedNames.add(full); return full; }
    }
    return 'Тестовый Пользователь ' + uidN;
  };
  const translit = (s) => s.toLowerCase().replace(/[^a-zа-яёәғқңөұүһі]/g, '').split('').map((c) => ({ а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sh', ы: 'y', э: 'e', ю: 'yu', я: 'ya', ә: 'a', ғ: 'g', қ: 'k', ң: 'n', ө: 'o', ұ: 'u', ү: 'u', һ: 'h', і: 'i', ъ: '', ь: '' }[c] ?? c)).join('');
  const makeUser = (o, extra) => {
    const name = makeName();
    const [sur, first] = name.split(' ');
    const id = 'u' + uidN++;
    const regionId = NETWORK_ORGS.includes(o.id) && chance(0.6) ? pick(regions).id : o.regionId;
    const startYear = rint(2016, 2025);
    const u = {
      id, name, email: `${translit(first)}.${translit(sur)}${uidN}@test.jastar.kz`, pass: null,
      position: pick(POSITIONS), companyId: o.id, dept: pick(DEPTS), regionId,
      city: regions.find((r) => r.id === regionId).city, startYear,
      bio: `Работаю в ${o.name} с ${startYear} года. В Молодёжном совете отвечаю за проекты и взаимодействие с подразделениями. Профиль тестовый.`,
      education: `${pick(UNIS)}, бакалавриат (${startYear - rint(0, 2)})` + (chance(0.35) ? `; магистратура (${startYear + rint(1, 3)})` : ''),
      interests: shuffle(INTERESTS).slice(0, 3).join(', '),
      skills: shuffle(SKILLS).slice(0, rint(3, 6)),
      sport: pick(SPORTS), councilRole: 'Участник', role: 'member', photo: null, media: [],
      verified: true, blocked: false, conflicts: [], createdAt: tsISO(-rint(60, 700)), demo: true,
      ...extra
    };
    users.push(u);

function rootOfSeed(id, orgs) {
  const o = orgs.find((x) => x.id === id);
  if (!o) return null;
  return o.type === 'subsidiary' ? o.parentId : o.id;
}

/* Конфликт интересов: эксперт не проверяет свою организацию и её филиалы, а также задекларированные организации */
function conflictOf(expert, orgId, orgs) {
  if (!expert) return true;
  const root = rootOfSeed(orgId, orgs);
  const list = [...(expert.conflicts || [])];
  if (expert.companyId) list.push(expert.companyId);
  return list.some((c) => {
    const cr = rootOfSeed(c, orgs);
    return c === orgId || c === root || (cr && (orgs.find((o) => o.id === cr) || {}).type !== 'fund' && cr === root);
  });
}

const STORE_KEY = 'jastar-hub:v' + SCHEMA_VERSION;
let DB = null;
let DB_REV = 0;
let STORAGE_OK = true;
const IDX = { users: new Map(), orgs: new Map(), regions: new Map() };

function loadDB() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.version === SCHEMA_VERSION && d.seedSig === SEED_SIG()) { DB = d; upgradeDB(); reindex(); saveDB(true); return; }
    }
  } catch (e) { STORAGE_OK = false; }
  /* удаляем данные прежних версий (в том числе со старой структурой организаций) */
  try { Object.keys(localStorage).filter((k) => k.startsWith('jastar-hub:v') && k !== STORE_KEY).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* не критично */ }
  DB = seedDB();
  reindex();
  saveDB(true);
}
/* Дополняет сохранённые в браузере демо-данные новыми разделами, не сбрасывая их */
function upgradeDB() {
  if (!Array.isArray(DB.vacancies)) DB.vacancies = demoVacancies();
  DB.settings = DB.settings || {};
  if (!Array.isArray(DB.settings.people)) DB.settings.people = JSON.parse(JSON.stringify(CONTACT_PEOPLE_DEFAULT));
  DB.orgs.forEach((o) => {
    if (o.profile) return;
    o.profile = JSON.parse(JSON.stringify(ORG_PROFILE[o.id] || {}));
    const seed = ORGS_SEED.find((x) => x.id === o.id);
    if (seed && ['esc', 'semey', 'oskemen', 'ktec'].includes(o.id)) { o.regionId = seed.regionId; o.sector = seed.sector; }
  });
}
let _saveT = null;
function saveDB(now) {
  clearTimeout(_saveT);
  const run = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); STORAGE_OK = true; } catch (e) { STORAGE_OK = false; } };
  if (now) run(); else _saveT = setTimeout(run, 120);
}
function reindex() {
  IDX.users = new Map(DB.users.map((u) => [u.id, u]));
  IDX.orgs = new Map(DB.orgs.map((o) => [o.id, o]));
  IDX.regions = new Map(DB.regions.map((r) => [r.id, r]));
}

  const u = me(); if (!u) return false;

  if (!open) return false;
  if (x.createdBy === u.id || x.leaderId === u.id || (x.organizers || []).includes(u.id)) return true;
  if (u.role === 'chair' && familyOf(rootOf(u.companyId)).includes(x.orgId) && (rootOf(u.companyId) === u.companyId || u.companyId === x.orgId)) return true;
  if (u.role === 'regional' && x.regionId === u.regionId) return true;
  return false;
}

  if (x.createdBy === u.id || x.leaderId === u.id || (x.team || []).some((t) => t.userId === u.id) || (x.organizers || []).includes(u.id)) return true;
  if (['chair', 'regional'].includes(u.role) && rootOf(x.orgId) === rootOf(u.companyId)) return true;
  if (u.role === 'regional' && x.regionId === u.regionId) return true;
  return false;
}

const COMPANY_COMPONENTS = [
  { k: 'projects', name: 'Проекты и результативность', hint: 'Сумма качества подтверждённых проектов (оценка эксперта × выполнение KPI), делённая на √(численность/100)' },

  { k: 'social', name: 'Социальная деятельность', hint: 'Социальные, экологические и благотворительные проекты + подтверждённые волонтёрские часы на одного молодого сотрудника' },

];
const PERSON_COMPONENTS = [
  { k: 'contrib', name: 'Личный вклад в проекты', hint: 'Качество каждого подтверждённого проекта × личная доля участника в команде' },
  { k: 'lead', name: 'Организация и лидерство', hint: 'Руководство подтверждёнными проектами и организация подтверждённых мероприятий' },
  { k: 'init', name: 'Реализованные инициативы', hint: 'Подтверждённые проекты, где сотрудник — автор инициативы' },

  { k: 'prof', name: 'Профессиональное развитие и наставничество', hint: 'Подтверждённые обучения, сертификаты и наставничество' }
];
const PERIODS = [
  { id: 'month', label: 'Месяц', m: 1 }, { id: 'quarter', label: 'Квартал', m: 3 }, { id: 'half', label: 'Полугодие', m: 6 },
  { id: 'year', label: 'Год', m: 12 }, { id: 'all', label: 'Весь период', m: 0 }
];
function periodRange(id, back = 0) {
  if (!id || id === 'all') {
    if (!back) return { from: null, to: null };
    const t = new Date(); t.setDate(t.getDate() - 30 * back); return { from: null, to: isoDate(t) };
  }
  const m = PERIODS.find((p) => p.id === id).m;
  const to = new Date(); to.setMonth(to.getMonth() - m * back);
  const from = new Date(to); from.setMonth(from.getMonth() - m);
  return { from: isoDate(from), to: isoDate(to) };
}
const inRange = (d, r) => !!d && (!r.from || d >= r.from) && (!r.to || d <= r.to);

const scoresAvg = (s) => (s ? (s.relevance + s.results + s.evidence + s.reach + s.kpi) / 5 : 0);
function kpiCompletion(p) {
  if (!p.kpis || !p.kpis.length) return 0.5;
  return sum(p.kpis, (k) => Math.min(1.2, k.plan ? k.fact / k.plan : 0)) / p.kpis.length;
}
/* качество проекта 0–10: оценка эксперта с поправкой на выполнение KPI. Фото на балл не влияют. */
function qProject(p) { return p.review && p.review.scores ? scoresAvg(p.review.scores) * (0.5 + 0.5 * Math.min(1, kpiCompletion(p))) : 0; }
function qEvent(e) { return e.review && e.review.scores ? scoresAvg(e.review.scores) * 0.4 : 0; }
const hasPartners = (p) => (p.partnerOrgIds || []).filter((x) => x !== p.orgId).length > 0 || p.category === 'inter';

/* Оценка доли уникально охваченных: участники разных активностей пересекаются, поэтому 1 − e^(−охват/численность). В рабочей версии — точный подсчёт по реестру участников. */
const uniqueShare = (reach, size) => (size > 0 ? 1 - Math.exp(-Math.max(0, reach) / size) : 0);
const _scoreCache = new Map();
function cached(key, fn) { if (_scoreCache.has(key)) return _scoreCache.get(key); const v = fn(); _scoreCache.set(key, v); return v; }

/* Рейтинг Молодёжных советов. level: 'all' — каждый совет отдельно; 'groups' — ДЗО вместе с филиалами */
function companyScores(opt = {}) {
  const o = { from: null, to: null, region: '', category: '', level: 'all', ...opt };
  return cached('c' + JSON.stringify(o), () => {
    const range = { from: o.from, to: o.to };
    const keyOf = (orgId) => (o.level === 'groups' ? rootOf(orgId) : orgId);
    const acc = new Map();
    const orgsIn = o.level === 'groups' ? DB.orgs.filter((x) => x.type !== 'subsidiary') : DB.orgs;
    orgsIn.forEach((x) => acc.set(x.id, { orgId: x.id, size: o.level === 'groups' ? sum(familyOf(x.id).map(O), (y) => y.young) : x.young, q: 0, qSocial: 0, qProf: 0, qInnov: 0, inter: 0, reach: 0, hours: 0, profCount: 0, news: 0, activities: 0, projects: 0, events: 0, regionHit: false }));
    const A = (orgId) => acc.get(keyOf(orgId));
    const catOk = (c) => !o.category || c === o.category;
    const regOk = (r) => !o.region || r === o.region;
    DB.projects.forEach((p) => {
      if (p.status !== 'confirmed' || !inRange(p.end, range) || !catOk(p.category) || !regOk(p.regionId)) return;
      const a = A(p.orgId); if (!a) return;
      const q = qProject(p);
      a.q += q; a.projects++; a.activities++; a.regionHit = true;
      a.reach += p.review.verifiedReach ?? p.reach;
      if (['social', 'charity', 'eco'].includes(p.category)) { a.qSocial += q; a.hours += p.review.verifiedHours ?? p.volunteerHours ?? 0; }
      if (['prof', 'edu'].includes(p.category)) a.qProf += q;
      if (p.category === 'innov') a.qInnov += q;
      if (hasPartners(p)) {
        const partners = uniq((p.partnerOrgIds || []).filter((x) => x !== p.orgId));
        a.inter += 1 + Math.min(3, partners.length) * 0.5;
        uniq(partners.map(keyOf)).forEach((k) => { if (k !== keyOf(p.orgId) && acc.get(k)) acc.get(k).inter += 1; });
      }
    });
    DB.events.forEach((e) => {
      if (e.status !== 'confirmed' || !inRange(e.date, range) || !catOk(e.category) || !regOk(e.regionId)) return;
      const a = A(e.orgId); if (!a) return;
      const q = qEvent(e);
      a.events++; a.activities++; a.regionHit = true;
      a.reach += e.review.verifiedAttended ?? e.attended;
      if (['social', 'charity', 'eco'].includes(e.category)) a.qSocial += q;
      if (['prof', 'edu'].includes(e.category)) a.qProf += q;
      if (e.category === 'innov') a.qInnov += q;
      if (e.category === 'inter') a.inter += 0.5;
    });
    DB.achievements.forEach((x) => {
      if (x.status !== 'confirmed' || !inRange(x.date, range)) return;
      const u = U(x.userId); if (!u || !u.companyId) return;
      if (!catOk(ACH_TYPES[x.type].cat) || !regOk(u.regionId)) return;
      const a = A(u.companyId); if (!a) return;
      a.activities++;
      if (x.type === 'volunteer' || x.type === 'social') a.hours += x.review?.verifiedHours ?? x.hours ?? 0;
      if (x.type === 'training' || x.type === 'mentoring') a.profCount++;
    });
    if (!o.category) DB.news.forEach((n) => {
      if (!n.published || !inRange(n.date, range)) return;
      const org = O(n.orgId); if (!org || !regOk(org.regionId)) return;
      const a = A(n.orgId); if (a) a.news++;
    });
    const rows = Array.from(acc.values()).map((a) => {
      const size = Math.max(a.size, 1);
      const s = Math.sqrt(Math.max(size, 30) / 100);
      const raw = {
        projects: a.q / s,
        reach: uniqueShare(a.reach, size) * 100,
        social: a.qSocial / s + (a.hours / size) * 10,
        prof: a.qProf / s + (a.profCount / size) * 50,
        inter: a.inter / s,
        innov: a.qInnov / s,
        info: (Math.min(a.news, DB.settings.infoCap) / DB.settings.infoCap) * 100
      };
      return { ...a, raw, engagement: uniqueShare(a.reach, size) * 100 };
    });
    const max = {};
    COMPANY_COMPONENTS.forEach(({ k }) => { max[k] = Math.max(0, ...rows.map((r) => r.raw[k])); });
    const w = DB.settings.wCompany;
    rows.forEach((r) => {
      r.comps = {};
      COMPANY_COMPONENTS.forEach(({ k }) => { r.comps[k] = max[k] > 0 ? (r.raw[k] / max[k]) * 100 : 0; });
      r.total = sum(COMPANY_COMPONENTS, ({ k }) => (r.comps[k] * (w[k] || 0)) / 100);
    });
    let out = rows;
    if (o.region) out = rows.filter((r) => r.regionHit || (O(r.orgId) && O(r.orgId).regionId === o.region));
    out.sort((a, b) => b.total - a.total || b.activities - a.activities || a.orgId.localeCompare(b.orgId));
    out.forEach((r, i) => { r.rank = i + 1; });
    return out;
  });
}

/* Индивидуальный рейтинг: только личный вклад, баллы компании сотруднику не передаются */
function personScores(opt = {}) {
  const o = { from: null, to: null, root: '', region: '', ...opt };
  return cached('p' + JSON.stringify(o), () => {
    const range = { from: o.from, to: o.to };
    const acc = new Map();
    DB.users.filter((u) => ['member', 'chair', 'regional'].includes(u.role) && !u.blocked).forEach((u) => acc.set(u.id, { userId: u.id, contrib: 0, lead: 0, init: 0, volunteer: 0, inter: 0, prof: 0, projects: 0, shares: [], events: 0 }));
    DB.projects.forEach((p) => {
      if (p.status !== 'confirmed' || !inRange(p.end, range)) return;
      const q = qProject(p);
      (p.team || []).forEach((t) => {
        const a = acc.get(t.userId); if (!a) return;
        a.contrib += (q * t.share) / 100; a.projects++; a.shares.push(t.share);
        if (hasPartners(p)) a.inter += 1;
        if (['social', 'charity', 'eco'].includes(p.category)) a.volunteer += ((p.review.verifiedHours ?? p.volunteerHours ?? 0) * t.share) / 100;
        if (['prof', 'edu'].includes(p.category)) a.prof += t.share / 100;
      });
      const l = acc.get(p.leaderId); if (l) l.lead += 2 + q * 0.5;
      const i = acc.get(p.initiatorId); if (i) i.init += q;
    });
    DB.events.forEach((e) => {
      if (e.status !== 'confirmed' || !inRange(e.date, range)) return;
      (e.organizers || []).forEach((id) => { const a = acc.get(id); if (a) { a.lead += 1.5; a.events++; } });
    });
    DB.achievements.forEach((x) => {
      if (x.status !== 'confirmed' || !inRange(x.date, range)) return;
      const a = acc.get(x.userId); if (!a) return;
      if (x.type === 'volunteer' || x.type === 'social') a.volunteer += x.review?.verifiedHours ?? x.hours ?? 0;
      if (x.type === 'training' || x.type === 'mentoring') a.prof += 1;
      if (x.type === 'award') a.prof += 0.5;
    });
    const rows = Array.from(acc.values());
    const max = {};
    PERSON_COMPONENTS.forEach(({ k }) => { max[k] = Math.max(0, ...rows.map((r) => r[k])); });
    const w = DB.settings.wPerson;
    rows.forEach((r) => {
      r.comps = {};
      PERSON_COMPONENTS.forEach(({ k }) => { r.comps[k] = max[k] > 0 ? (r[k] / max[k]) * 100 : 0; });
      r.total = sum(PERSON_COMPONENTS, ({ k }) => (r.comps[k] * (w[k] || 0)) / 100);
      r.avgShare = r.shares.length ? sum(r.shares) / r.shares.length : 0;
    });
    let out = rows;
    if (o.root) out = out.filter((r) => rootOf(U(r.userId).companyId) === o.root);
    if (o.region) out = out.filter((r) => U(r.userId).regionId === o.region);
    out.sort((a, b) => b.total - a.total || b.projects - a.projects || a.userId.localeCompare(b.userId));
    out.forEach((r, i) => { r.rank = i + 1; });
    return out;
  });
}

/* Позиции за предыдущий сопоставимый период — для стрелок ↑↓ */
function prevRanks(fn, opt, period) {
  const prev = periodRange(period, 1);
  const rows = fn({ ...opt, ...prev });
  const m = new Map(); rows.forEach((r) => m.set(r.orgId || r.userId, r.rank));
  return m;
}
/* Динамика места по месяцам (6 точек) */
function rankHistory(orgId, level = 'all') {
  return cached('h' + orgId + level, () => {
    const pts = [];
    for (let i = 5; i >= 0; i--) {
      const to = new Date(); to.setMonth(to.getMonth() - i);
      const rows = companyScores({ from: null, to: isoDate(to), level });
      const r = rows.find((x) => x.orgId === orgId);

}
function personBadges(userId) {
  return cached('b' + userId, () => {

    const led = conf.filter((p) => p.leaderId === userId).length;

    const ach = DB.achievements.filter((a) => a.userId === userId && a.status === 'confirmed');

    const rank = (personScores().find((r) => r.userId === userId) || {}).rank;
    const b = [];
